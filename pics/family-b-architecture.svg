<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" data-topology="environment-policy-coevolution" role="img" aria-labelledby="architecture-title-b architecture-desc-b">
<title id="architecture-title-b">B 家族：数据、任务与环境整体思想架构</title>
<desc id="architecture-desc-b">本文原创分类架构，不是某篇论文原图。让下一轮的学习分布也成为可改进对象；同时维持可解性、覆盖与反馈可靠性，而非只把题目变难。 环境生成、任务自博弈和历史回放不同；Dream-RSI 的历史世界不等于训练一个神经世界模型。</desc>
<style>.node{fill:var(--node,#152b43);stroke:var(--line,#43647f);stroke-width:1.6}.state,.candidate{stroke:var(--accent,#69d8c8);stroke-width:2.5}.gate{stroke:var(--gold,#ffd08a)}.edge{fill:none;stroke:var(--accent,#69d8c8);stroke-width:2}.advice{stroke:var(--gold,#ffd08a);stroke-dasharray:6 4}.node-label{fill:var(--text,#edf5ff);font:20px system-ui,sans-serif;font-weight:650}.node-detail{fill:var(--muted,#b8cadb);font:14px system-ui,sans-serif}.edge-label{fill:var(--muted,#b8cadb);font:13px system-ui,sans-serif}.edge-caption rect{fill:var(--bg,#0b1727)}.selected .node{stroke:var(--focus,#fff);stroke-width:3.5}.database-cap{fill:none;stroke:var(--accent,#69d8c8);stroke-width:1.5}.stack-mark{stroke:var(--accent,#69d8c8);stroke-width:2}.architecture-region rect{fill:var(--panel,#102238);fill-opacity:.6;stroke:var(--line,#43647f);stroke-dasharray:5 6}.architecture-region text{fill:var(--muted,#b8cadb);font:14px system-ui,sans-serif}</style>
<rect width="1200" height="900" rx="20" fill="var(--bg,#0b1727)"/>
<defs><marker id="architecture-arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--accent,#69d8c8)"/></marker></defs>
<text x="600" y="39" text-anchor="middle" fill="var(--text,#edf5ff)" font-family="system-ui,sans-serif" font-size="26" font-weight="700">B · 任务与策略两种群的耦合共演化</text>
<text x="600" y="69" text-anchor="middle" fill="var(--muted,#b8cadb)" font-family="system-ui,sans-serif" font-size="14">核心差异：左边改学习分布，右边改求解策略；匹配与覆盖连接两个循环。</text>
<g class="architecture-region"><rect x="30" y="165" width="310" height="400" rx="20"/><text x="46" y="188">挑战分布的演化</text></g><g class="architecture-region"><rect x="830" y="165" width="340" height="400" rx="20"/><text x="846" y="188">求解策略的适应</text></g>
<path class="edge" data-from="seed" data-to="matching" d="M600 175L600 210" marker-end="url(#architecture-arrow-b)"/><g class="edge-caption"><rect x="663.5" y="180" width="53" height="22" rx="5"/><text class="edge-label" x="690" y="195" text-anchor="middle">初始化</text></g><path class="edge" data-from="tasks" data-to="matching" d="M315 265L435 265" marker-end="url(#architecture-arrow-b)"/><g class="edge-caption"><rect x="355" y="232" width="40" height="22" rx="5"/><text class="edge-label" x="375" y="247" text-anchor="middle">挑战</text></g><path class="edge" data-from="policies" data-to="matching" d="M855 265L765 265" marker-end="url(#architecture-arrow-b)"/><g class="edge-caption"><rect x="790" y="232" width="40" height="22" rx="5"/><text class="edge-label" x="810" y="247" text-anchor="middle">策略</text></g><path class="edge" data-from="matching" data-to="validity" d="M600 320L600 380L510 380L510 430" marker-end="url(#architecture-arrow-b)"/><g class="edge-caption"><rect x="637" y="350" width="66" height="22" rx="5"/><text class="edge-label" x="670" y="365" text-anchor="middle">执行证据</text></g><path class="edge" data-from="validity" data-to="generate" d="M390 485L315 485" marker-end="url(#architecture-arrow-b)"/><g class="edge-caption"><rect x="335" y="451" width="40" height="22" rx="5"/><text class="edge-label" x="355" y="466" text-anchor="middle">反馈</text></g><path class="edge" data-from="generate" data-to="tasks" d="M185 430L185 320" marker-end="url(#architecture-arrow-b)"/><g class="edge-caption"><rect x="218.5" y="365" width="53" height="22" rx="5"/><text class="edge-label" x="245" y="380" text-anchor="middle">新挑战</text></g><path class="edge" data-from="matching" data-to="learn" d="M600 320L600 350L1000 350L1000 430" marker-end="url(#architecture-arrow-b)"/><g class="edge-caption"><rect x="956.5" y="370" width="87" height="22" rx="5"/><text class="edge-label" x="1000" y="385" text-anchor="middle">交互 / 学习</text></g><path class="edge" data-from="learn" data-to="validity" d="M855 485L630 485" marker-end="url(#architecture-arrow-b)"/><g class="edge-caption"><rect x="707" y="450" width="66" height="22" rx="5"/><text class="edge-label" x="740" y="465" text-anchor="middle">收益信号</text></g><path class="edge" data-from="learn" data-to="policies" d="M1145 485L1175 485L1175 265L1145 265" marker-end="url(#architecture-arrow-b)"/><g class="edge-caption"><rect x="1057" y="367" width="66" height="22" rx="5"/><text class="edge-label" x="1090" y="382" text-anchor="middle">策略更新</text></g><path class="edge" data-from="validity" data-to="coverage" d="M510 540L510 585L565 585L565 620" marker-end="url(#architecture-arrow-b)"/><g class="edge-caption"><rect x="630.5" y="557" width="79" height="22" rx="5"/><text class="edge-label" x="670" y="572" text-anchor="middle">覆盖与失败</text></g><path class="edge" data-from="coverage" data-to="archive" d="M390 660L315 660" marker-end="url(#architecture-arrow-b)"/><g class="edge-caption"><rect x="330" y="628" width="40" height="22" rx="5"/><text class="edge-label" x="350" y="643" text-anchor="middle">保留</text></g><path class="edge" data-from="archive" data-to="tasks" d="M55 660L25 660L25 265L55 265" marker-end="url(#architecture-arrow-b)"/><g class="edge-caption"><rect x="62" y="575" width="66" height="22" rx="5"/><text class="edge-label" x="95" y="590" text-anchor="middle">课程回流</text></g>
<g class="architecture-node" data-node="0" data-component="seed"><rect class="node input" x="440" y="95" width="320" height="80" rx="15"/><text class="node-label" x="600" y="122" text-anchor="middle">种子规则 / 搜索预算</text><text class="node-detail" x="600" y="149" text-anchor="middle">环境约束与外部目标</text><text class="node-detail" x="600" y="171" text-anchor="middle">不能靠改规则抬分</text></g><g class="architecture-node" data-node="1" data-component="tasks"><path class="node state" d="M55 227C55 206 315 206 315 227V303C315 324 55 324 55 303Z"/><ellipse class="database-cap" cx="185" cy="227" rx="130" ry="16"/><text class="node-label" x="185" y="258" text-anchor="middle">任务 / 环境种群</text><text class="node-detail" x="185" y="285" text-anchor="middle">保留不同难度与生态位</text><text class="node-detail" x="185" y="307" text-anchor="middle">不是固定题单的重采样</text></g><g class="architecture-node" data-node="2" data-component="generate"><rect class="node updater" x="55" y="430" width="260" height="110" rx="15"/><text class="node-label" x="185" y="463" text-anchor="middle">生成 / 变异挑战</text><text class="node-detail" x="185" y="490" text-anchor="middle">课程、环境或历史回放</text><text class="node-detail" x="185" y="512" text-anchor="middle">探索下一轮学习分布</text></g><g class="architecture-node" data-node="3" data-component="validity"><path class="node gate" d="M414 430H606L630 485L606 540H414L390 485Z"/><text class="node-label" x="510" y="463" text-anchor="middle">有效性 / 学习价值</text><text class="node-detail" x="510" y="490" text-anchor="middle">可解性、难度、regret</text><text class="node-detail" x="510" y="512" text-anchor="middle">避免无效或过易任务</text></g><g class="architecture-node" data-node="4" data-component="policies"><path class="node state" d="M855 227C855 206 1145 206 1145 227V303C1145 324 855 324 855 303Z"/><ellipse class="database-cap" cx="1000" cy="227" rx="145" ry="16"/><text class="node-label" x="1000" y="258" text-anchor="middle">求解策略种群</text><text class="node-detail" x="1000" y="285" text-anchor="middle">策略与任务共同变化</text><text class="node-detail" x="1000" y="307" text-anchor="middle">按方法声明权重是否更新</text></g><g class="architecture-node" data-node="5" data-component="learn"><rect class="node execution" x="855" y="430" width="290" height="110" rx="15"/><text class="node-label" x="1000" y="463" text-anchor="middle">尝试 / 学习策略</text><text class="node-detail" x="1000" y="490" text-anchor="middle">交互、训练或探索代码改进</text><text class="node-detail" x="1000" y="512" text-anchor="middle">不把更多任务当作能力</text></g><g class="architecture-node" data-node="6" data-component="matching"><rect class="node execution" x="435" y="210" width="330" height="110" rx="15"/><text class="node-label" x="600" y="243" text-anchor="middle">任务—策略匹配</text><text class="node-detail" x="600" y="270" text-anchor="middle">让挑战进入实际求解</text><text class="node-detail" x="600" y="292" text-anchor="middle">交叉测试与迁移有成本</text></g><g class="architecture-node" data-node="7" data-component="coverage"><rect class="node feedback" x="390" y="620" width="350" height="80" rx="15"/><text class="node-label" x="565" y="647" text-anchor="middle">覆盖 / 迁移 / 发现历史</text><text class="node-detail" x="565" y="674" text-anchor="middle">保留失败与新颖性证据</text><text class="node-detail" x="565" y="696" text-anchor="middle">与内部任务收益分开报告</text></g><g class="architecture-node" data-node="8" data-component="archive"><rect class="node reuse" x="55" y="620" width="260" height="80" rx="15"/><text class="node-label" x="185" y="647" text-anchor="middle">保留多样环境</text><text class="node-detail" x="185" y="674" text-anchor="middle">课程与历史真正被复用</text><text class="node-detail" x="185" y="696" text-anchor="middle">不是无限增加题量</text></g>
<rect x="30" y="790" width="1140" height="86" rx="14" fill="var(--panel,#102238)" stroke="var(--line,#43647f)"/>
<text x="52" y="817" fill="var(--text,#edf5ff)" font-family="system-ui,sans-serif" font-size="14">持久对象：任务池、课程、环境生成器、模拟器与发现历史</text>
<text x="52" y="844" fill="var(--muted,#b8cadb)" font-family="system-ui,sans-serif" font-size="13">环境规则、可执行反馈和任务权限必须明确；内部得分不能替代外部分布测量。</text>
<text x="600" y="895" text-anchor="middle" fill="var(--muted,#b8cadb)" font-family="system-ui,sans-serif" font-size="12">原创家族架构，不是某篇论文原图；虚线表示可选更新或建议审计，不保证所有方法实现。</text>
</svg>
