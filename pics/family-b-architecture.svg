<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="architecture-title-b architecture-desc-b">
<title id="architecture-title-b">B 家族：数据、任务与环境整体思想架构</title>
<desc id="architecture-desc-b">本文原创分类架构，不是某篇论文原图。让下一轮的学习分布也成为可改进对象；同时维持可解性、覆盖与反馈可靠性，而非只把题目变难。 环境生成、任务自博弈和历史回放不同；Dream-RSI 的历史世界不等于训练一个神经世界模型。</desc>
<style>.node{fill:var(--node,#152b43);stroke:var(--line,#43647f);stroke-width:1.6}.state,.candidate{stroke:var(--accent,#69d8c8);stroke-width:2.5}.gate{stroke:var(--gold,#ffd08a);stroke-dasharray:6 4}.edge{fill:none;stroke:var(--accent,#69d8c8);stroke-width:2}.advice{stroke:var(--gold,#ffd08a);stroke-dasharray:6 4}.node-label{fill:var(--text,#edf5ff);font:19px system-ui,sans-serif;font-weight:650}.node-detail{fill:var(--muted,#b8cadb);font:14px system-ui,sans-serif}.edge-label{fill:var(--muted,#b8cadb);font:13px system-ui,sans-serif}.selected .node{stroke:var(--focus,#fff);stroke-width:3.5}</style>
<rect width="1200" height="760" rx="20" fill="var(--bg,#0b1727)"/>
<defs><marker id="architecture-arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--accent,#69d8c8)"/></marker></defs>
<text x="600" y="40" text-anchor="middle" fill="var(--text,#edf5ff)" font-family="system-ui,sans-serif" font-size="27" font-weight="700">B 家族 · 数据、任务与环境整体思想架构</text>
<text x="600" y="68" text-anchor="middle" fill="var(--muted,#b8cadb)" font-family="system-ui,sans-serif" font-size="14">分类层面的组件与持久状态关系；不是某篇论文算法，也不声称所有方法都实现虚线审计。</text>
<path class="edge" d="M150 170V130H750V170" marker-end="url(#architecture-arrow-b)"/><text class="edge-label" x="690" y="119" text-anchor="middle">任务输入</text>
<path class="edge" d="M570 228H630" marker-end="url(#architecture-arrow-b)"/><text class="edge-label" x="600" y="214" text-anchor="middle">读取</text>
<path class="edge" d="M870 228H930" marker-end="url(#architecture-arrow-b)"/><text class="edge-label" x="900" y="214" text-anchor="middle">反馈</text>
<path class="edge" d="M1050 286V450" marker-end="url(#architecture-arrow-b)"/><text class="edge-label" x="1110" y="372" text-anchor="middle">改进信号</text>
<path class="edge" d="M930 508H870" marker-end="url(#architecture-arrow-b)"/><text class="edge-label" x="900" y="494" text-anchor="middle">提案</text>
<path class="edge" d="M630 508H570" marker-end="url(#architecture-arrow-b)"/><text class="edge-label" x="600" y="494" text-anchor="middle">评价</text>
<path class="edge" d="M330 508H270" marker-end="url(#architecture-arrow-b)"/><text class="edge-label" x="300" y="494" text-anchor="middle">接受</text>
<path class="edge" d="M30 508H15V98H450V170" marker-end="url(#architecture-arrow-b)"/><text class="edge-label" x="700" y="88" text-anchor="middle">持久产物回流：必须真正被下一轮读取</text>
<path class="edge advice" d="M450 450V286" marker-end="url(#architecture-arrow-b)"/><text class="edge-label" x="522" y="372" text-anchor="middle">拒绝时保留旧版</text>
<path d="M438 130H462" fill="none" stroke="var(--bg,#0b1727)" stroke-width="10"/>
<path d="M438 130H462" fill="none" stroke="var(--accent,#69d8c8)" stroke-width="2"/>
<g class="architecture-node" data-node="0"><rect class="node input" x="30" y="170" width="240" height="116" rx="15"/><text class="node-label" x="150" y="206" text-anchor="middle">初始任务与环境规则</text><text class="node-detail" x="150" y="236" text-anchor="middle">种子任务、模拟器与接口</text><text class="node-detail" x="150" y="259" text-anchor="middle">先定义可解性与有效性</text></g><g class="architecture-node" data-node="1"><rect class="node state" x="330" y="170" width="240" height="116" rx="15"/><text class="node-label" x="450" y="206" text-anchor="middle">持久任务 / 环境状态</text><text class="node-detail" x="450" y="236" text-anchor="middle">任务池、课程与历史存档</text><text class="node-detail" x="450" y="259" text-anchor="middle">或可学习的任务生成器</text></g><g class="architecture-node" data-node="2"><rect class="node execution" x="630" y="170" width="240" height="116" rx="15"/><text class="node-label" x="750" y="206" text-anchor="middle">求解与环境交互</text><text class="node-detail" x="750" y="236" text-anchor="middle">策略尝试新挑战</text><text class="node-detail" x="750" y="259" text-anchor="middle">保留成功与失败轨迹</text></g><g class="architecture-node" data-node="3"><rect class="node feedback" x="930" y="170" width="240" height="116" rx="15"/><text class="node-label" x="1050" y="206" text-anchor="middle">难度与覆盖反馈</text><text class="node-detail" x="1050" y="236" text-anchor="middle">执行结果、regret、多样性</text><text class="node-detail" x="1050" y="259" text-anchor="middle">不能只奖励更容易的题</text></g><g class="architecture-node" data-node="4"><rect class="node updater" x="930" y="450" width="240" height="116" rx="15"/><text class="node-label" x="1050" y="486" text-anchor="middle">分布改进组件</text><text class="node-detail" x="1050" y="516" text-anchor="middle">生成、变异、筛选或回放</text><text class="node-detail" x="1050" y="539" text-anchor="middle">与求解策略更新分开测</text></g><g class="architecture-node" data-node="5"><rect class="node candidate" x="630" y="450" width="240" height="116" rx="15"/><text class="node-label" x="750" y="486" text-anchor="middle">候选任务 / 环境</text><text class="node-detail" x="750" y="516" text-anchor="middle">新课程、挑战或回放配置</text><text class="node-detail" x="750" y="539" text-anchor="middle">记录与父分布的关系</text></g><g class="architecture-node" data-node="6"><rect class="node gate" x="330" y="450" width="240" height="116" rx="15"/><text class="node-label" x="450" y="486" text-anchor="middle">准入与覆盖检查</text><text class="node-detail" x="450" y="516" text-anchor="middle">有效、可解、不过度收缩</text><text class="node-detail" x="450" y="539" text-anchor="middle">独立迁移是额外证据</text></g><g class="architecture-node" data-node="7"><rect class="node reuse" x="30" y="450" width="240" height="116" rx="15"/><text class="node-label" x="150" y="486" text-anchor="middle">进入后续学习 / 发现</text><text class="node-detail" x="150" y="516" text-anchor="middle">新分布被真正消费</text><text class="node-detail" x="150" y="539" text-anchor="middle">不只把候选存入目录</text></g>
<rect x="30" y="623" width="1140" height="109" rx="14" fill="var(--panel,#102238)" stroke="var(--line,#43647f)"/>
<text x="52" y="652" fill="var(--accent,#69d8c8)" font-family="system-ui,sans-serif" font-size="16" font-weight="650">持久状态与边界</text>
<text x="52" y="680" fill="var(--text,#edf5ff)" font-family="system-ui,sans-serif" font-size="14">任务池、课程、环境生成器、模拟器与发现历史</text>
<text x="52" y="708" fill="var(--muted,#b8cadb)" font-family="system-ui,sans-serif" font-size="13">环境规则、可执行反馈和任务权限必须明确；内部得分不能替代外部分布测量。</text>
</svg>
