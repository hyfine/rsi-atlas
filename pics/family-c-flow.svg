<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-labelledby="flow-title-c"><title id="flow-title-c">C 家族代表流程：技能路线：持久工具与经验整合</title><rect width="920" height="480" rx="20" fill="#101c2d"/><defs><marker id="flow-arrow-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#63d4ca"/></marker></defs><text x="460" y="42" text-anchor="middle" fill="#edf5ff" font-family="system-ui,sans-serif" font-size="25">技能路线：持久工具与经验整合</text><text x="460" y="71" text-anchor="middle" fill="#b0c1d5" font-family="system-ui,sans-serif" font-size="14">代表方法或分析性协议，不代替家族整体架构；不是所有论文共同算法。</text><path d="M265 130H345" fill="none" stroke="#63d4ca" stroke-width="2" marker-end="url(#flow-arrow-c)"/><path d="M575 130H655" fill="none" stroke="#63d4ca" stroke-width="2" marker-end="url(#flow-arrow-c)"/><path d="M770 175V255" fill="none" stroke="#63d4ca" stroke-width="2" marker-end="url(#flow-arrow-c)"/><path d="M655 300H575" fill="none" stroke="#63d4ca" stroke-width="2" marker-end="url(#flow-arrow-c)"/><path d="M345 300H265" fill="none" stroke="#63d4ca" stroke-width="2" marker-end="url(#flow-arrow-c)"/><path d="M35 300H14V130H35" fill="none" stroke="#ffcb78" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#flow-arrow-c)"/><g data-step="0"><rect x="35" y="85" width="230" height="90" rx="14" fill="#17283e" stroke="#36516c"/><text x="150" y="118" text-anchor="middle" fill="#63d4ca" font-family="system-ui,sans-serif" font-size="13">STEP 1</text><text x="150" y="150" text-anchor="middle" fill="#edf5ff" font-family="system-ui,sans-serif" font-size="18">检索已有技能</text></g><g data-step="1"><rect x="345" y="85" width="230" height="90" rx="14" fill="#17283e" stroke="#36516c"/><text x="460" y="118" text-anchor="middle" fill="#63d4ca" font-family="system-ui,sans-serif" font-size="13">STEP 2</text><text x="460" y="150" text-anchor="middle" fill="#edf5ff" font-family="system-ui,sans-serif" font-size="18">组合执行</text></g><g data-step="2"><rect x="655" y="85" width="230" height="90" rx="14" fill="#17283e" stroke="#36516c"/><text x="770" y="118" text-anchor="middle" fill="#63d4ca" font-family="system-ui,sans-serif" font-size="13">STEP 3</text><text x="770" y="150" text-anchor="middle" fill="#edf5ff" font-family="system-ui,sans-serif" font-size="18">识别能力缺口</text></g><g data-step="3"><rect x="655" y="255" width="230" height="90" rx="14" fill="#17283e" stroke="#36516c"/><text x="770" y="288" text-anchor="middle" fill="#63d4ca" font-family="system-ui,sans-serif" font-size="13">STEP 4</text><text x="770" y="320" text-anchor="middle" fill="#edf5ff" font-family="system-ui,sans-serif" font-size="18">生成并验证</text></g><g data-step="4"><rect x="345" y="255" width="230" height="90" rx="14" fill="#17283e" stroke="#36516c"/><text x="460" y="288" text-anchor="middle" fill="#63d4ca" font-family="system-ui,sans-serif" font-size="13">STEP 5</text><text x="460" y="320" text-anchor="middle" fill="#edf5ff" font-family="system-ui,sans-serif" font-size="18">去重合并入库</text></g><g data-step="5"><rect x="35" y="255" width="230" height="90" rx="14" fill="#17283e" stroke="#36516c"/><text x="150" y="288" text-anchor="middle" fill="#63d4ca" font-family="system-ui,sans-serif" font-size="13">STEP 6</text><text x="150" y="320" text-anchor="middle" fill="#edf5ff" font-family="system-ui,sans-serif" font-size="18">后续任务复用</text></g><text x="460" y="395" text-anchor="middle" fill="#b0c1d5" font-family="system-ui,sans-serif" font-size="15">变化：技能、工具、检索与适用条件</text><text x="460" y="426" text-anchor="middle" fill="#ffcb78" font-family="system-ui,sans-serif" font-size="14">具体冻结边界、反馈局限与所读版本见 HTML。</text><text x="460" y="454" text-anchor="middle" fill="#b0c1d5" font-family="system-ui,sans-serif" font-size="13">虚线表示回流可能，不保证每轮改善，不是实验轨迹。</text></svg>
