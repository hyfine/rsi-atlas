<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-labelledby="title desc"><title id="title">D 家族参考闭环：HarnessPro：性能—成本前沿</title><desc id="desc">生成测试只生成一次并固定；Pareto 三档代表没有单一全序赢家。搜索费用与部署费用分开。 六步：建立初始轨迹，冻结生成测试，诊断并编辑候选，同测试评价，保留三档前沿，回流与最终盲测。</desc><rect width="920" height="480" rx="20" fill="#101c2d"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#63d4ca"/></marker></defs><text x="460" y="42" text-anchor="middle" fill="#edf5ff" font-family="system-ui,sans-serif" font-size="25">HarnessPro：性能—成本前沿</text><text x="460" y="71" text-anchor="middle" fill="#b0c1d5" font-family="system-ui,sans-serif" font-size="14">家族代表结构 / 分析性协议 · 不是所有论文共同算法 · 虚线仅表示回流</text><path d="M265 130 H345" fill="none" stroke="#63d4ca" stroke-width="2" marker-end="url(#arrow)"/><path d="M575 130 H655" fill="none" stroke="#63d4ca" stroke-width="2" marker-end="url(#arrow)"/><path d="M770 175 V255" fill="none" stroke="#63d4ca" stroke-width="2" marker-end="url(#arrow)"/><path d="M655 300 H575" fill="none" stroke="#63d4ca" stroke-width="2" marker-end="url(#arrow)"/><path d="M345 300 H265" fill="none" stroke="#63d4ca" stroke-width="2" marker-end="url(#arrow)"/><path d="M35 300 H14 V130 H35" fill="none" stroke="#ffcb78" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="35" y="85" width="230" height="90" rx="14" fill="#17283e" stroke="#36516c"/><text x="150" y="118" text-anchor="middle" fill="#63d4ca" font-family="system-ui,sans-serif" font-size="13">STEP 1</text><text x="150" y="150" text-anchor="middle" fill="#edf5ff" font-family="system-ui,sans-serif" font-size="18">建立初始轨迹</text><rect x="345" y="85" width="230" height="90" rx="14" fill="#17283e" stroke="#36516c"/><text x="460" y="118" text-anchor="middle" fill="#63d4ca" font-family="system-ui,sans-serif" font-size="13">STEP 2</text><text x="460" y="150" text-anchor="middle" fill="#edf5ff" font-family="system-ui,sans-serif" font-size="18">冻结生成测试</text><rect x="655" y="85" width="230" height="90" rx="14" fill="#17283e" stroke="#36516c"/><text x="770" y="118" text-anchor="middle" fill="#63d4ca" font-family="system-ui,sans-serif" font-size="13">STEP 3</text><text x="770" y="150" text-anchor="middle" fill="#edf5ff" font-family="system-ui,sans-serif" font-size="18">诊断并编辑候选</text><rect x="655" y="255" width="230" height="90" rx="14" fill="#17283e" stroke="#36516c"/><text x="770" y="288" text-anchor="middle" fill="#63d4ca" font-family="system-ui,sans-serif" font-size="13">STEP 4</text><text x="770" y="320" text-anchor="middle" fill="#edf5ff" font-family="system-ui,sans-serif" font-size="18">同测试评价</text><rect x="345" y="255" width="230" height="90" rx="14" fill="#17283e" stroke="#36516c"/><text x="460" y="288" text-anchor="middle" fill="#63d4ca" font-family="system-ui,sans-serif" font-size="13">STEP 5</text><text x="460" y="320" text-anchor="middle" fill="#edf5ff" font-family="system-ui,sans-serif" font-size="18">保留三档前沿</text><rect x="35" y="255" width="230" height="90" rx="14" fill="#17283e" stroke="#36516c"/><text x="150" y="288" text-anchor="middle" fill="#63d4ca" font-family="system-ui,sans-serif" font-size="13">STEP 6</text><text x="150" y="320" text-anchor="middle" fill="#edf5ff" font-family="system-ui,sans-serif" font-size="18">回流与最终盲测</text><text x="460" y="395" text-anchor="middle" fill="#b0c1d5" font-family="system-ui,sans-serif" font-size="15">变化：提示、技能、工具和控制结构</text><text x="460" y="426" text-anchor="middle" fill="#ffcb78" font-family="system-ui,sans-serif" font-size="14">请在 HTML 中查看冻结边界、逐步解释与原始证据。</text><text x="460" y="454" text-anchor="middle" fill="#b0c1d5" font-family="system-ui,sans-serif" font-size="13">示意图不保证每轮改善，不是实验轨迹。</text></svg>
