</div><script type="application/json" id="family-data">{"family":{"id":"f","code":"F","title":"AI 研发与元改进","scene":"meta","idea":"把研究、搜索、提案、选择或预算机制也当作候选对象；关键证据是新改进器实际接管下一轮，而非只多生成一份程序。","persistent":"目标系统 S、改进器 I、实验策略、调度、算子、证据与谱系","boundary":"最外层控制、评价或基础模型常仍固定；理论可证明自修改与经验搜索不是同一种保证。","distinction":"自动研发、系统递归、改进器递归分开；若 I 不变，可以有系统反馈，但不能称 I 已自我演化。","evidence":"从同起点、同后续预算比较旧新改进器，计入发现成本；任务分数不替代改进效率。","nodes":[{"id":"objective","label":"研究目标 / 可写边界","detail":["系统与改进器分别定义","提出可反驳的改进目标"],"type":"input","box":[40,140,260,100]},{"id":"meta","label":"外层元控制 / 预算","detail":["决定实验、算子与调度","最外层经常仍是固定的"],"type":"updater","box":[440,140,340,100]},{"id":"improver","label":"改进器 I_t","detail":["提案、搜索与选择策略","自动研发不必然改变 I"],"type":"state","box":[440,340,340,110]},{"id":"system","label":"目标系统 S_t","detail":["模型、程序与可变资产","任务收益与元收益分开"],"type":"execution","box":[440,555,340,110]},{"id":"results","label":"任务表现 / 完整成本","detail":["含失败、低分和搜索成本","不是只报最终赢家"],"type":"feedback","box":[880,555,260,110]},{"id":"continuation","label":"同起点继续实验","detail":["旧 I 与新 I 同预算续跑","比较后继改进效率"],"type":"gate","shape":"gate","box":[880,340,260,110]},{"id":"candidate","label":"候选改进器 I'","detail":["修改产生改进的机制","不只再生成目标程序"],"type":"candidate","box":[40,340,260,110]},{"id":"handoff","label":"安装 / 接管证据","detail":["新 I 实际进入下一轮","保存文件不等于完成交接"],"type":"reuse","box":[40,555,260,110]},{"id":"lineage","label":"双层版本谱系 (S, I)","detail":["目标产物与改进器分开留证"],"type":"state","shape":"stack","box":[440,705,340,65]}],"archetype":"目标系统—改进器—元控制的分层递归","archetype_en":"System–improver–meta-controller hierarchy","diagram":{"kind":"meta-improver-stack","caption":"核心差异：改进器本身成为可更新资产；必须证明接管与后续效用，而不只证明任务分数上涨。","regions":[{"box":[420,95,380,165],"label":"外层：可能仍固定"},{"box":[420,295,380,175],"label":"改进层 / I_t"},{"box":[420,510,380,175],"label":"任务层：求解与执行"}],"edges":[{"from":"objective","to":"meta","ports":"right-left","label":"目标 / 约束","at":[370,173]},{"from":"meta","to":"improver","ports":"bottom-top","label":"调度 / 提案","at":[700,287]},{"from":"improver","to":"system","ports":"bottom-top","label":"修改 S","at":[690,505]},{"from":"system","to":"results","ports":"right-left","label":"测量","at":[830,590]},{"from":"results","to":"continuation","ports":"top-bottom","label":"后续收益","at":[1090,505]},{"from":"continuation","to":"improver","ports":"left-right","label":"对照","at":[830,365]},{"from":"continuation","to":"meta","ports":"top-right","via":[[1010,275],[820,275],[820,190]],"label":"改进效率","at":[990,257]},{"from":"meta","to":"candidate","ports":"left-top","via":[[350,190],[350,285],[170,285]],"label":"元提案","at":[245,267]},{"from":"candidate","to":"handoff","ports":"bottom-top","label":"审计 I'","at":[245,505],"optional":true},{"from":"handoff","to":"improver","ports":"right-left","via":[[370,610],[370,395]],"label":"后继真正接管","at":[365,490]},{"from":"system","to":"lineage","ports":"bottom-top","label":"版本","at":[705,695]},{"from":"handoff","to":"lineage","ports":"bottom-left","via":[[170,737]],"label":"(S', I')","at":[310,720]}]},"sources":[{"name":"STOP","url":"https://arxiv.org/abs/2310.02304"},{"name":"Hyperagents","url":"https://arxiv.org/abs/2603.19461"},{"name":"MetaRSI","url":"https://arxiv.org/abs/2609.06396"}]},"scene":{"id":"meta","title":"MetaRSI：三算子、双轴与调度","object":"数据、Harness、训练产物、算子提案与调度策略","fixed":"受保护执行/评价内核与最外层 meta-policy","source":"https://arxiv.org/html/2609.06396v2","note":"这是论文结构示意；开放科学是议程，实验主要在代码与闭式科学。三算子不是本图谱的三个递归等级。","steps":[{"label":"观察诊断","detail":"统一内核收集当前系统失败和证据。目标模型承担多个角色，不消除同模型的共享错误。"},{"label":"水平选顺序","detail":"选择 Data-RSI、Harness-RSI、Model-RSI 的有类型组合；需要当前版本新鲜证据。"},{"label":"垂直改提案","detail":"优化各算子的提案策略。Harness 不改权重；Model 候选按论文规定从基座和累计数据训练。"},{"label":"执行与选择","detail":"受保护代码验证边界、执行、选择与导出。候选生成权不等于发布权。"},{"label":"按 term 改调度","detail":"依据完整 term 结果更新路由、预算、停止和垂直优化时机。最外层机制仍冻结，递归层数有限。"},{"label":"配对继续验证","detail":"从同一个系统分叉，比较旧/新改进器同预算的后续收益；另核对跨 term 留出访问依赖。"}]},"default_view":"architecture"}</script>
<script>
'use strict';const data=JSON.parse(document.getElementById('family-data').textContent);const {family,scene}=data;const $=id=>document.getElementById(id);const escape=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let step=0,timer=null;
document.title=family.code+' 家族 · '+family.title+'整体思想架构';$('title').textContent=family.code+' 家族 · '+family.title;$('idea').textContent=family.idea;$('persistent').textContent=family.persistent;$('boundary').textContent=family.boundary;$('distinction').textContent=family.distinction;$('evidence').textContent=family.evidence;$('flow-title').textContent=scene.title;$('flow-note').textContent=scene.note;$('sources').innerHTML=family.sources.map(source=>'<a href="'+escape(source.url)+'" target="_blank" rel="noopener">'+escape(source.name)+'</a>').join('');
document.querySelectorAll('.diagram svg').forEach(svg=>svg.setAttribute('role','group'));
function selectNode(index){const node=family.nodes[index];document.querySelectorAll('[data-node]').forEach(element=>{element.classList.toggle('selected',Number(element.dataset.node)===index);element.setAttribute('aria-pressed',String(Number(element.dataset.node)===index));});$('node-detail').innerHTML='<h2>'+escape(node.label)+'</h2><p>'+escape(node.detail.join('；'))+'</p>';}
$('mobile-nodes').innerHTML=family.nodes.map((node,index)=>'<button data-node="'+index+'">'+escape(node.label)+'<br><span class="small">'+escape(node.detail.join('；'))+'</span></button>').join('');
document.querySelectorAll('[data-node]').forEach(node=>{node.setAttribute('role','button');node.setAttribute('tabindex','0');node.setAttribute('aria-label',family.nodes[Number(node.dataset.node)].label);node.addEventListener('click',()=>selectNode(Number(node.dataset.node)));node.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();selectNode(Number(node.dataset.node));}});});
function stop(){if(timer!==null)clearInterval(timer);timer=null;$('play').textContent='播放';$('play').setAttribute('aria-pressed','false');$('flow-frame').classList.remove('playing');}
function showView(kind){stop();$('architecture').hidden=kind!=='architecture';$('flow').hidden=kind!=='flow';$('architecture-tab').classList.toggle('active',kind==='architecture');$('flow-tab').classList.toggle('active',kind==='flow');$('svg-link').href='family-'+family.id+'-'+kind+'.svg';}
function showStep(){const current=scene.steps[step];$('position').textContent=(step+1)+' / '+scene.steps.length;$('flow-detail').innerHTML='<h2>'+escape(current.label)+'</h2><p>'+escape(current.detail)+'</p>';$('flow-frame').querySelectorAll('[data-step]').forEach(node=>node.classList.toggle('selected',Number(node.dataset.step)===step));$('all-steps').innerHTML=scene.steps.map((item,index)=>'<div class="flow-step '+(index===step?'current':'')+'"><strong>'+escape((index+1)+'. '+item.label)+'</strong><p>'+escape(item.detail)+'</p></div>').join('');$('next').disabled=step===scene.steps.length-1;}
$('flow-frame').querySelectorAll('[data-step]').forEach(node=>{node.setAttribute('role','button');node.setAttribute('tabindex','0');node.setAttribute('aria-label',scene.steps[Number(node.dataset.step)].label);const choose=()=>{stop();step=Number(node.dataset.step);showStep();};node.addEventListener('click',choose);node.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();choose();}});});
$('architecture-tab').onclick=()=>showView('architecture');$('flow-tab').onclick=()=>showView('flow');$('theme').onclick=()=>document.body.classList.toggle('light');$('next').onclick=()=>{stop();step=Math.min(step+1,scene.steps.length-1);showStep();};$('reset').onclick=()=>{stop();step=0;showStep();};$('play').onclick=()=>{if(timer!==null){stop();return;}if(step===scene.steps.length-1)step=0;showStep();$('play').textContent='暂停';$('play').setAttribute('aria-pressed','true');$('flow-frame').classList.add('playing');timer=setInterval(()=>{step++;showStep();if(step===scene.steps.length-1)stop();},Number($('speed').value));};$('speed').onchange=stop;document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});selectNode(1);showStep();showView(data.default_view);window.familyReady=true;
</script></body></html>
