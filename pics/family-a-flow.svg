<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" role="img" aria-labelledby="title desc"><title id="title">A 家族参考闭环：STaR / ReST-EM：生成—筛选—学习</title><desc id="desc">这是共同结构；STaR 的答案条件 rationalization 与 ReST-EM 的 E/M 调度不同。原始方法的基座重置不能省略。 六步：准备外部真值，当前模型采样，筛选成功轨迹，监督更新，独立任务评价，新模型再生成。</desc><rect width="920" height="480" rx="20" fill="#101c2d"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#63d4ca"/></marker></defs><text x="460" y="42" text-anchor="middle" fill="#edf5ff" font-family="system-ui,sans-serif" font-size="25">STaR / ReST-EM：生成—筛选—学习</text><text x="460" y="71" text-anchor="middle" fill="#b0c1d5" font-family="system-ui,sans-serif" font-size="14">家族代表结构 / 分析性协议 · 不是所有论文共同算法 · 虚线仅表示回流</text><path d="M265 130 H345" fill="none" stroke="#63d4ca" stroke-width="2" marker-end="url(#arrow)"/><path d="M575 130 H655" fill="none" stroke="#63d4ca" stroke-width="2" marker-end="url(#arrow)"/><path d="M770 175 V255" fill="none" stroke="#63d4ca" stroke-width="2" marker-end="url(#arrow)"/><path d="M655 300 H575" fill="none" stroke="#63d4ca" stroke-width="2" marker-end="url(#arrow)"/><path d="M345 300 H265" fill="none" stroke="#63d4ca" stroke-width="2" marker-end="url(#arrow)"/><path d="M35 300 H14 V130 H35" fill="none" stroke="#ffcb78" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="35" y="85" width="230" height="90" rx="14" fill="#17283e" stroke="#36516c"/><text x="150" y="118" text-anchor="middle" fill="#63d4ca" font-family="system-ui,sans-serif" font-size="13">STEP 1</text><text x="150" y="150" text-anchor="middle" fill="#edf5ff" font-family="system-ui,sans-serif" font-size="18">准备外部真值</text><rect x="345" y="85" width="230" height="90" rx="14" fill="#17283e" stroke="#36516c"/><text x="460" y="118" text-anchor="middle" fill="#63d4ca" font-family="system-ui,sans-serif" font-size="13">STEP 2</text><text x="460" y="150" text-anchor="middle" fill="#edf5ff" font-family="system-ui,sans-serif" font-size="18">当前模型采样</text><rect x="655" y="85" width="230" height="90" rx="14" fill="#17283e" stroke="#36516c"/><text x="770" y="118" text-anchor="middle" fill="#63d4ca" font-family="system-ui,sans-serif" font-size="13">STEP 3</text><text x="770" y="150" text-anchor="middle" fill="#edf5ff" font-family="system-ui,sans-serif" font-size="18">筛选成功轨迹</text><rect x="655" y="255" width="230" height="90" rx="14" fill="#17283e" stroke="#36516c"/><text x="770" y="288" text-anchor="middle" fill="#63d4ca" font-family="system-ui,sans-serif" font-size="13">STEP 4</text><text x="770" y="320" text-anchor="middle" fill="#edf5ff" font-family="system-ui,sans-serif" font-size="18">监督更新</text><rect x="345" y="255" width="230" height="90" rx="14" fill="#17283e" stroke="#36516c"/><text x="460" y="288" text-anchor="middle" fill="#63d4ca" font-family="system-ui,sans-serif" font-size="13">STEP 5</text><text x="460" y="320" text-anchor="middle" fill="#edf5ff" font-family="system-ui,sans-serif" font-size="18">独立任务评价</text><rect x="35" y="255" width="230" height="90" rx="14" fill="#17283e" stroke="#36516c"/><text x="150" y="288" text-anchor="middle" fill="#63d4ca" font-family="system-ui,sans-serif" font-size="13">STEP 6</text><text x="150" y="320" text-anchor="middle" fill="#edf5ff" font-family="system-ui,sans-serif" font-size="18">新模型再生成</text><text x="460" y="395" text-anchor="middle" fill="#b0c1d5" font-family="system-ui,sans-serif" font-size="15">变化：生成模型、筛选轨迹与训练产物</text><text x="460" y="426" text-anchor="middle" fill="#ffcb78" font-family="system-ui,sans-serif" font-size="14">请在 HTML 中查看冻结边界、逐步解释与原始证据。</text><text x="460" y="454" text-anchor="middle" fill="#b0c1d5" font-family="system-ui,sans-serif" font-size="13">示意图不保证每轮改善，不是实验轨迹。</text></svg>
