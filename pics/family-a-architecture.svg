<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="architecture-title-a architecture-desc-a">
<title id="architecture-title-a">A 家族：模型与训练整体思想架构</title>
<desc id="architecture-desc-a">本文原创分类架构，不是某篇论文原图。把可用反馈转成跨轮保留的模型能力；关键是参数或训练配方真的变化，而不是本次答案被修改。 自训练、自博弈、RL、蒸馏和测试时适应是不同子路线；每轮初始化与参数继承方式按具体论文核验。</desc>
<style>.node{fill:var(--node,#152b43);stroke:var(--line,#43647f);stroke-width:1.6}.state,.candidate{stroke:var(--accent,#69d8c8);stroke-width:2.5}.gate{stroke:var(--gold,#ffd08a);stroke-dasharray:6 4}.edge{fill:none;stroke:var(--accent,#69d8c8);stroke-width:2}.advice{stroke:var(--gold,#ffd08a);stroke-dasharray:6 4}.node-label{fill:var(--text,#edf5ff);font:19px system-ui,sans-serif;font-weight:650}.node-detail{fill:var(--muted,#b8cadb);font:14px system-ui,sans-serif}.edge-label{fill:var(--muted,#b8cadb);font:13px system-ui,sans-serif}.selected .node{stroke:var(--focus,#fff);stroke-width:3.5}</style>
<rect width="1200" height="760" rx="20" fill="var(--bg,#0b1727)"/>
<defs><marker id="architecture-arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--accent,#69d8c8)"/></marker></defs>
<text x="600" y="40" text-anchor="middle" fill="var(--text,#edf5ff)" font-family="system-ui,sans-serif" font-size="27" font-weight="700">A 家族 · 模型与训练整体思想架构</text>
<text x="600" y="68" text-anchor="middle" fill="var(--muted,#b8cadb)" font-family="system-ui,sans-serif" font-size="14">分类层面的组件与持久状态关系；不是某篇论文算法，也不声称所有方法都实现虚线审计。</text>
<path class="edge" d="M150 170V130H750V170" marker-end="url(#architecture-arrow-a)"/><text class="edge-label" x="690" y="119" text-anchor="middle">任务输入</text>
<path class="edge" d="M570 228H630" marker-end="url(#architecture-arrow-a)"/><text class="edge-label" x="600" y="214" text-anchor="middle">读取</text>
<path class="edge" d="M870 228H930" marker-end="url(#architecture-arrow-a)"/><text class="edge-label" x="900" y="214" text-anchor="middle">反馈</text>
<path class="edge" d="M1050 286V450" marker-end="url(#architecture-arrow-a)"/><text class="edge-label" x="1110" y="372" text-anchor="middle">改进信号</text>
<path class="edge" d="M930 508H870" marker-end="url(#architecture-arrow-a)"/><text class="edge-label" x="900" y="494" text-anchor="middle">提案</text>
<path class="edge" d="M630 508H570" marker-end="url(#architecture-arrow-a)"/><text class="edge-label" x="600" y="494" text-anchor="middle">评价</text>
<path class="edge" d="M330 508H270" marker-end="url(#architecture-arrow-a)"/><text class="edge-label" x="300" y="494" text-anchor="middle">接受</text>
<path class="edge" d="M30 508H15V98H450V170" marker-end="url(#architecture-arrow-a)"/><text class="edge-label" x="700" y="88" text-anchor="middle">持久产物回流：必须真正被下一轮读取</text>
<path class="edge advice" d="M450 450V286" marker-end="url(#architecture-arrow-a)"/><text class="edge-label" x="522" y="372" text-anchor="middle">拒绝时保留旧版</text>
<path d="M438 130H462" fill="none" stroke="var(--bg,#0b1727)" stroke-width="10"/>
<path d="M438 130H462" fill="none" stroke="var(--accent,#69d8c8)" stroke-width="2"/>
<g class="architecture-node" data-node="0"><rect class="node input" x="30" y="170" width="240" height="116" rx="15"/><text class="node-label" x="150" y="206" text-anchor="middle">任务、数据与监督</text><text class="node-detail" x="150" y="236" text-anchor="middle">人工/合成输入与外部约束</text><text class="node-detail" x="150" y="259" text-anchor="middle">正确答案、执行器或奖励来源</text></g><g class="architecture-node" data-node="1"><rect class="node state" x="330" y="170" width="240" height="116" rx="15"/><text class="node-label" x="450" y="206" text-anchor="middle">当前模型与配置</text><text class="node-detail" x="450" y="236" text-anchor="middle">θ_t / adapter / 训练配方</text><text class="node-detail" x="450" y="259" text-anchor="middle">跨轮保留的能力载体</text></g><g class="architecture-node" data-node="2"><rect class="node execution" x="630" y="170" width="240" height="116" rx="15"/><text class="node-label" x="750" y="206" text-anchor="middle">生成与交互组件</text><text class="node-detail" x="750" y="236" text-anchor="middle">采样回答、程序或轨迹</text><text class="node-detail" x="750" y="259" text-anchor="middle">记录实际生成预算</text></g><g class="architecture-node" data-node="3"><rect class="node feedback" x="930" y="170" width="240" height="116" rx="15"/><text class="node-label" x="1050" y="206" text-anchor="middle">筛选与反馈组件</text><text class="node-detail" x="1050" y="236" text-anchor="middle">答案、执行奖励或偏好</text><text class="node-detail" x="1050" y="259" text-anchor="middle">正确输出不保证推理忠实</text></g><g class="architecture-node" data-node="4"><rect class="node updater" x="930" y="450" width="240" height="116" rx="15"/><text class="node-label" x="1050" y="486" text-anchor="middle">训练 / 更新组件</text><text class="node-detail" x="1050" y="516" text-anchor="middle">SFT、RL、蒸馏或内循环</text><text class="node-detail" x="1050" y="539" text-anchor="middle">不能忽略基座重置与教师</text></g><g class="architecture-node" data-node="5"><rect class="node candidate" x="630" y="450" width="240" height="116" rx="15"/><text class="node-label" x="750" y="486" text-anchor="middle">候选模型产物</text><text class="node-detail" x="750" y="516" text-anchor="middle">θ&apos;、adapter 与训练证据</text><text class="node-detail" x="750" y="539" text-anchor="middle">不是仅保存一份新回答</text></g><g class="architecture-node" data-node="6"><rect class="node gate" x="330" y="450" width="240" height="116" rx="15"/><text class="node-label" x="450" y="486" text-anchor="middle">评价与版本选择</text><text class="node-detail" x="450" y="516" text-anchor="middle">检查质量、成本与遗忘</text><text class="node-detail" x="450" y="539" text-anchor="middle">独立留出/回滚是审计要求</text></g><g class="architecture-node" data-node="7"><rect class="node reuse" x="30" y="450" width="240" height="116" rx="15"/><text class="node-label" x="150" y="486" text-anchor="middle">后继模型实际使用</text><text class="node-detail" x="150" y="516" text-anchor="middle">新模型求解或生成新数据</text><text class="node-detail" x="150" y="539" text-anchor="middle">回流路径需有版本证据</text></g>
<rect x="30" y="623" width="1140" height="109" rx="14" fill="var(--panel,#102238)" stroke="var(--line,#43647f)"/>
<text x="52" y="652" fill="var(--accent,#69d8c8)" font-family="system-ui,sans-serif" font-size="16" font-weight="650">持久状态与边界</text>
<text x="52" y="680" fill="var(--text,#edf5ff)" font-family="system-ui,sans-serif" font-size="14">模型权重 θ、adapter、训练配置和训练数据版本</text>
<text x="52" y="708" fill="var(--muted,#b8cadb)" font-family="system-ui,sans-serif" font-size="13">题目/数据来源、验证口径与预算要声明；教师或答案监督不能被隐藏。</text>
</svg>
