<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" data-topology="parameter-learning" role="img" aria-labelledby="architecture-title-a architecture-desc-a">
<title id="architecture-title-a">A 家族：模型与训练整体思想架构</title>
<desc id="architecture-desc-a">本文原创分类架构，不是某篇论文原图。把可用反馈转成跨轮保留的模型能力；关键是参数或训练配方真的变化，而不是本次答案被修改。 自训练、自博弈、RL、蒸馏和测试时适应是不同子路线；每轮初始化与参数继承方式按具体论文核验。</desc>
<style>.node{fill:var(--node,#152b43);stroke:var(--line,#43647f);stroke-width:1.6}.state,.candidate{stroke:var(--accent,#69d8c8);stroke-width:2.5}.gate{stroke:var(--gold,#ffd08a)}.edge{fill:none;stroke:var(--accent,#69d8c8);stroke-width:2}.advice{stroke:var(--gold,#ffd08a);stroke-dasharray:6 4}.node-label{fill:var(--text,#edf5ff);font:20px system-ui,sans-serif;font-weight:650}.node-detail{fill:var(--muted,#b8cadb);font:14px system-ui,sans-serif}.edge-label{fill:var(--muted,#b8cadb);font:13px system-ui,sans-serif}.edge-caption rect{fill:var(--bg,#0b1727)}.selected .node{stroke:var(--focus,#fff);stroke-width:3.5}.database-cap{fill:none;stroke:var(--accent,#69d8c8);stroke-width:1.5}.stack-mark{stroke:var(--accent,#69d8c8);stroke-width:2}.architecture-region rect{fill:var(--panel,#102238);fill-opacity:.6;stroke:var(--line,#43647f);stroke-dasharray:5 6}.architecture-region text{fill:var(--muted,#b8cadb);font:14px system-ui,sans-serif}</style>
<rect width="1200" height="900" rx="20" fill="var(--bg,#0b1727)"/>
<defs><marker id="architecture-arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--accent,#69d8c8)"/></marker></defs>
<text x="600" y="39" text-anchor="middle" fill="var(--text,#edf5ff)" font-family="system-ui,sans-serif" font-size="26" font-weight="700">A · 以参数为中心的采样—学习双环</text>
<text x="600" y="69" text-anchor="middle" fill="var(--muted,#b8cadb)" font-family="system-ui,sans-serif" font-size="14">核心差异：梯度或适应步骤改变 θ；反馈先变成学习信号，再变成跨轮能力。</text>
<g class="architecture-region"><rect x="380" y="115" width="790" height="415" rx="20"/><text x="396" y="138">参数适应内环：采样 → 反馈 → 学习</text></g>
<path class="edge" data-from="tasks" data-to="rollout" d="M300 170L350 170L350 215L410 215" marker-end="url(#architecture-arrow-a)"/><g class="edge-caption"><rect x="323" y="133" width="54" height="22" rx="5"/><text class="edge-label" x="350" y="148" text-anchor="middle">任务 x</text></g><path class="edge" data-from="model" data-to="rollout" d="M300 380L350 380L350 295L560 295L560 270" marker-end="url(#architecture-arrow-a)"/><g class="edge-caption"><rect x="408" y="303" width="74" height="22" rx="5"/><text class="edge-label" x="445" y="318" text-anchor="middle">θ_t 推理</text></g><path class="edge" data-from="rollout" data-to="reward" d="M710 215L840 215" marker-end="url(#architecture-arrow-a)"/><g class="edge-caption"><rect x="731.5" y="182" width="87" height="22" rx="5"/><text class="edge-label" x="775" y="197" text-anchor="middle">采样 / 执行</text></g><path class="edge" data-from="reward" data-to="signal" d="M990 270L990 370" marker-end="url(#architecture-arrow-a)"/><g class="edge-caption"><rect x="1037" y="310" width="66" height="22" rx="5"/><text class="edge-label" x="1070" y="325" text-anchor="middle">外部反馈</text></g><path class="edge" data-from="signal" data-to="update" d="M840 425L710 425" marker-end="url(#architecture-arrow-a)"/><g class="edge-caption"><rect x="731.5" y="392" width="87" height="22" rx="5"/><text class="edge-label" x="775" y="407" text-anchor="middle">目标 / 优势</text></g><path class="edge" data-from="update" data-to="model" d="M410 425L350 425L350 380L300 380" marker-end="url(#architecture-arrow-a)"/><g class="edge-caption"><rect x="320" y="470" width="60" height="22" rx="5"/><text class="edge-label" x="350" y="485" text-anchor="middle">更新 θ</text></g><path class="edge" data-from="model" data-to="checkpoint" d="M170 460L170 580" marker-end="url(#architecture-arrow-a)"/><g class="edge-caption"><rect x="212" y="515" width="66" height="22" rx="5"/><text class="edge-label" x="245" y="530" text-anchor="middle">跨轮继承</text></g><path class="edge advice" data-from="checkpoint" data-to="evaluation" d="M300 630L500 635" marker-end="url(#architecture-arrow-a)"/><g class="edge-caption"><rect x="367" y="599" width="66" height="22" rx="5"/><text class="edge-label" x="400" y="614" text-anchor="middle">对照确认</text></g><path class="edge advice" data-from="evaluation" data-to="model" d="M715 585L715 545L330 545L330 380L300 380" marker-end="url(#architecture-arrow-a)"/><g class="edge-caption"><rect x="606" y="553" width="118" height="22" rx="5"/><text class="edge-label" x="665" y="568" text-anchor="middle">获准后进入下一轮</text></g>
<g class="architecture-node" data-node="0" data-component="tasks"><rect class="node input" x="40" y="120" width="260" height="100" rx="15"/><text class="node-label" x="170" y="153" text-anchor="middle">任务与监督锚点</text><text class="node-detail" x="170" y="180" text-anchor="middle">真实或合成任务</text><text class="node-detail" x="170" y="202" text-anchor="middle">答案、执行器或教师</text></g><g class="architecture-node" data-node="1" data-component="model"><rect class="node state" x="40" y="300" width="260" height="160" rx="15"/><path class="stack-mark" d="M54 314H78M54 320H78M54 326H78"/><text class="node-label" x="170" y="333" text-anchor="middle">可训练模型 θ_t</text><text class="node-detail" x="170" y="360" text-anchor="middle">权重 / adapter 是能力载体</text><text class="node-detail" x="170" y="382" text-anchor="middle">不是仅修改本次回答</text></g><g class="architecture-node" data-node="2" data-component="rollout"><rect class="node execution" x="410" y="160" width="300" height="110" rx="15"/><text class="node-label" x="560" y="193" text-anchor="middle">采样 / 交互轨迹</text><text class="node-detail" x="560" y="220" text-anchor="middle">当前模型回答或执行</text><text class="node-detail" x="560" y="242" text-anchor="middle">记录生成与交互预算</text></g><g class="architecture-node" data-node="3" data-component="reward"><rect class="node feedback" x="840" y="160" width="300" height="110" rx="15"/><text class="node-label" x="990" y="193" text-anchor="middle">验证 / 奖励 / 偏好</text><text class="node-detail" x="990" y="220" text-anchor="middle">区分答案、测试与自评</text><text class="node-detail" x="990" y="242" text-anchor="middle">外部监督不能被隐藏</text></g><g class="architecture-node" data-node="4" data-component="signal"><rect class="node candidate" x="840" y="370" width="300" height="110" rx="15"/><text class="node-label" x="990" y="403" text-anchor="middle">可学习信号</text><text class="node-detail" x="990" y="430" text-anchor="middle">筛选样本、优势或软目标</text><text class="node-detail" x="990" y="452" text-anchor="middle">反馈不直接等于参数更新</text></g><g class="architecture-node" data-node="5" data-component="update"><rect class="node updater" x="410" y="370" width="300" height="110" rx="15"/><text class="node-label" x="560" y="403" text-anchor="middle">SFT / RL / 蒸馏</text><text class="node-detail" x="560" y="430" text-anchor="middle">显式更新模型参数</text><text class="node-detail" x="560" y="452" text-anchor="middle">声明重置或持续训练</text></g><g class="architecture-node" data-node="6" data-component="checkpoint"><rect class="node reuse" x="40" y="580" width="260" height="100" rx="15"/><text class="node-label" x="170" y="613" text-anchor="middle">后继模型 θ_(t+1)</text><text class="node-detail" x="170" y="640" text-anchor="middle">持久化检查点与训练配置</text><text class="node-detail" x="170" y="662" text-anchor="middle">参与后续求解或数据生成</text></g><g class="architecture-node" data-node="7" data-component="evaluation"><path class="node gate" d="M524 585H906L930 635L906 685H524L500 635Z"/><text class="node-label" x="715" y="618" text-anchor="middle">泛化 / 遗忘 / 完整成本</text><text class="node-detail" x="715" y="645" text-anchor="middle">开发增益与最终确认分开</text><text class="node-detail" x="715" y="667" text-anchor="middle">独立晋级是审计要求</text></g>
<rect x="30" y="790" width="1140" height="86" rx="14" fill="var(--panel,#102238)" stroke="var(--line,#43647f)"/>
<text x="52" y="817" fill="var(--text,#edf5ff)" font-family="system-ui,sans-serif" font-size="14">持久对象：模型权重 θ、adapter、训练配置和训练数据版本</text>
<text x="52" y="844" fill="var(--muted,#b8cadb)" font-family="system-ui,sans-serif" font-size="13">题目/数据来源、验证口径与预算要声明；教师或答案监督不能被隐藏。</text>
<text x="600" y="895" text-anchor="middle" fill="var(--muted,#b8cadb)" font-family="system-ui,sans-serif" font-size="12">原创家族架构，不是某篇论文原图；虚线表示可选更新或建议审计，不保证所有方法实现。</text>
</svg>
