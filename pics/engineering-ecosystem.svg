<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="engineering-chart-title"><title id="engineering-chart-title">工作簿工程分类：项目数量，不是能力或质量排名</title><rect width="1200" height="660" rx="22" fill="#0b1727"/><g font-family="system-ui,sans-serif"><text x="35" y="48" fill="#edf5ff" font-size="27" font-weight="700">147 个工程入口 · 10 类改进目标</text><text x="35" y="83" fill="#b5cadc" font-size="15">保留工作簿的单一主分类；A–F 是额外的分析映射，不能相加当作项目数。</text><text x="35" y="139" fill="#d9e9f5" font-size="17">Harness 与系统自优化</text><rect x="360" y="115" width="660" height="30" rx="7" fill="#6bd9c7"/><text x="1035" y="139" fill="#edf5ff" font-size="17">26</text><text x="35" y="184" fill="#d9e9f5" font-size="17">自修改智能体</text><rect x="360" y="160" width="253.84615384615387" height="30" rx="7" fill="#8fb8f7"/><text x="628.8461538461538" y="184" fill="#edf5ff" font-size="17">10</text><text x="35" y="229" fill="#d9e9f5" font-size="17">算法与程序发现</text><rect x="360" y="205" width="406.1538461538462" height="30" rx="7" fill="#b09beb"/><text x="781.1538461538462" y="229" fill="#edf5ff" font-size="17">16</text><text x="35" y="274" fill="#d9e9f5" font-size="17">模型权重自进化</text><rect x="360" y="250" width="533.0769230769231" height="30" rx="7" fill="#73bec9"/><text x="908.0769230769231" y="274" fill="#edf5ff" font-size="17">21</text><text x="35" y="319" fill="#d9e9f5" font-size="17">提示与上下文优化</text><rect x="360" y="295" width="228.46153846153845" height="30" rx="7" fill="#dfa979"/><text x="603.4615384615385" y="319" fill="#edf5ff" font-size="17">9</text><text x="35" y="364" fill="#d9e9f5" font-size="17">经验、技能与记忆</text><rect x="360" y="340" width="634.6153846153846" height="30" rx="7" fill="#6bd9c7"/><text x="1009.6153846153846" y="364" fill="#edf5ff" font-size="17">25</text><text x="35" y="409" fill="#d9e9f5" font-size="17">AI 自动化科研</text><rect x="360" y="385" width="609.2307692307693" height="30" rx="7" fill="#8fb8f7"/><text x="984.2307692307693" y="409" fill="#edf5ff" font-size="17">24</text><text x="35" y="454" fill="#d9e9f5" font-size="17">具身与环境探索</text><rect x="360" y="430" width="126.92307692307693" height="30" rx="7" fill="#b09beb"/><text x="501.9230769230769" y="454" fill="#edf5ff" font-size="17">5</text><text x="35" y="499" fill="#d9e9f5" font-size="17">RSI 与 AI 研发评测</text><rect x="360" y="475" width="203.0769230769231" height="30" rx="7" fill="#73bec9"/><text x="578.0769230769231" y="499" fill="#edf5ff" font-size="17">8</text><text x="35" y="544" fill="#d9e9f5" font-size="17">安全、治理与验证</text><rect x="360" y="520" width="76.15384615384616" height="30" rx="7" fill="#dfa979"/><text x="451.1538461538462" y="544" fill="#edf5ff" font-size="17">3</text><text x="35" y="607" fill="#b5cadc" font-size="14">2026-11-06 工作簿快照 · 147 个收录入口 · 44 个排除候选 · 未重新审计全部源码</text><text x="35" y="635" fill="#8ea8bd" font-size="13">图表仅表达收藏的组成；stars 为页面近似值，关注度、许可和实现主张不能替代递归有效性证据。</text></g></svg>
