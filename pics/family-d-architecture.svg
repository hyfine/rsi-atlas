<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" data-topology="harness-search-tree" role="img" aria-labelledby="architecture-title-d architecture-desc-d">
<title id="architecture-title-d">D 家族：Harness 与工作流整体思想架构</title>
<desc id="architecture-desc-d">本文原创分类架构，不是某篇论文原图。优化模型外的执行结构：提示、工具、路由、上下文与控制代码；把轨迹诊断转成可评价的系统版本。 提示编辑、图结构搜索、源代码自修改和生产扩展不同；固定外层优化器不自动是元递归。</desc>
<style>.node{fill:var(--node,#152b43);stroke:var(--line,#43647f);stroke-width:1.6}.state,.candidate{stroke:var(--accent,#69d8c8);stroke-width:2.5}.gate{stroke:var(--gold,#ffd08a)}.edge{fill:none;stroke:var(--accent,#69d8c8);stroke-width:2}.advice{stroke:var(--gold,#ffd08a);stroke-dasharray:6 4}.node-label{fill:var(--text,#edf5ff);font:20px system-ui,sans-serif;font-weight:650}.node-detail{fill:var(--muted,#b8cadb);font:14px system-ui,sans-serif}.edge-label{fill:var(--muted,#b8cadb);font:13px system-ui,sans-serif}.edge-caption rect{fill:var(--bg,#0b1727)}.selected .node{stroke:var(--focus,#fff);stroke-width:3.5}.database-cap{fill:none;stroke:var(--accent,#69d8c8);stroke-width:1.5}.stack-mark{stroke:var(--accent,#69d8c8);stroke-width:2}.architecture-region rect{fill:var(--panel,#102238);fill-opacity:.6;stroke:var(--line,#43647f);stroke-dasharray:5 6}.architecture-region text{fill:var(--muted,#b8cadb);font:14px system-ui,sans-serif}</style>
<rect width="1200" height="900" rx="20" fill="var(--bg,#0b1727)"/>
<defs><marker id="architecture-arrow-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--accent,#69d8c8)"/></marker></defs>
<text x="600" y="39" text-anchor="middle" fill="var(--text,#edf5ff)" font-family="system-ui,sans-serif" font-size="26" font-weight="700">D · 可编辑控制结构的分支搜索与选择</text>
<text x="600" y="69" text-anchor="middle" fill="var(--muted,#b8cadb)" font-family="system-ui,sans-serif" font-size="14">核心差异：搜索的是执行程序与控制结构；提示、图、代码是分支，不是必须串行的三阶段。</text>
<g class="architecture-region"><rect x="385" y="275" width="785" height="180" rx="20"/><text x="401" y="298">候选可写面</text></g>
<path class="edge" data-from="fixed" data-to="editor" d="M300 160L420 165" marker-end="url(#architecture-arrow-d)"/><g class="edge-caption"><rect x="320.5" y="130" width="79" height="22" rx="5"/><text class="edge-label" x="360" y="145" text-anchor="middle">任务与约束</text></g><path class="edge" data-from="incumbent" data-to="editor" d="M300 360L350 360L350 165L420 165" marker-end="url(#architecture-arrow-d)"/><g class="edge-caption"><rect x="317" y="255" width="66" height="22" rx="5"/><text class="edge-label" x="350" y="270" text-anchor="middle">运行轨迹</text></g><path class="edge" data-from="editor" data-to="prompt" d="M595 215L595 255L525 255L525 330" marker-end="url(#architecture-arrow-d)"/><g class="edge-caption"><rect x="465" y="227" width="40" height="22" rx="5"/><text class="edge-label" x="485" y="242" text-anchor="middle">提案</text></g><path class="edge" data-from="editor" data-to="graph" d="M595 215L595 255L780 255L780 330" marker-end="url(#architecture-arrow-d)"/><path class="edge" data-from="editor" data-to="code" d="M595 215L595 255L1035 255L1035 330" marker-end="url(#architecture-arrow-d)"/><path class="edge" data-from="prompt" data-to="runner" d="M525 430L525 560L675 560" marker-end="url(#architecture-arrow-d)"/><g class="edge-caption"><rect x="527" y="480" width="66" height="22" rx="5"/><text class="edge-label" x="560" y="495" text-anchor="middle">候选执行</text></g><path class="edge" data-from="graph" data-to="runner" d="M780 430L780 470L825 470L825 510" marker-end="url(#architecture-arrow-d)"/><path class="edge" data-from="code" data-to="runner" d="M1035 430L1035 560L975 560" marker-end="url(#architecture-arrow-d)"/><g class="edge-caption"><rect x="1032" y="480" width="66" height="22" rx="5"/><text class="edge-label" x="1065" y="495" text-anchor="middle">候选执行</text></g><path class="edge" data-from="runner" data-to="metrics" d="M825 610L825 660" marker-end="url(#architecture-arrow-d)"/><g class="edge-caption"><rect x="870" y="622" width="40" height="22" rx="5"/><text class="edge-label" x="890" y="637" text-anchor="middle">评价</text></g><path class="edge" data-from="metrics" data-to="selection" d="M675 700L640 700L640 750L170 750L170 710" marker-end="url(#architecture-arrow-d)"/><g class="edge-caption"><rect x="380.5" y="720" width="79" height="22" rx="5"/><text class="edge-label" x="420" y="735" text-anchor="middle">效用与约束</text></g><path class="edge" data-from="selection" data-to="lineage" d="M300 650L395 650" marker-end="url(#architecture-arrow-d)"/><g class="edge-caption"><rect x="330" y="617" width="40" height="22" rx="5"/><text class="edge-label" x="350" y="632" text-anchor="middle">晋级</text></g><path class="edge" data-from="lineage" data-to="incumbent" d="M500 590L500 550L170 550L170 420" marker-end="url(#architecture-arrow-d)"/><g class="edge-caption"><rect x="297" y="518" width="96" height="22" rx="5"/><text class="edge-label" x="345" y="533" text-anchor="middle">部署 H_(t+1)</text></g>
<g class="architecture-node" data-node="0" data-component="fixed"><rect class="node input" x="40" y="115" width="260" height="90" rx="15"/><text class="node-label" x="170" y="148" text-anchor="middle">固定任务 / 模型 / 预算</text><text class="node-detail" x="170" y="175" text-anchor="middle">约束不随候选任意变化</text><text class="node-detail" x="170" y="197" text-anchor="middle">最终评价接口受保护</text></g><g class="architecture-node" data-node="1" data-component="incumbent"><rect class="node state" x="40" y="300" width="260" height="120" rx="15"/><path class="stack-mark" d="M54 314H78M54 320H78M54 326H78"/><text class="node-label" x="170" y="333" text-anchor="middle">当前 Harness H_t</text><text class="node-detail" x="170" y="360" text-anchor="middle">提示、上下文、工具与控制</text><text class="node-detail" x="170" y="382" text-anchor="middle">与冻结 backbone 配对</text></g><g class="architecture-node" data-node="2" data-component="editor"><rect class="node updater" x="420" y="115" width="350" height="100" rx="15"/><text class="node-label" x="595" y="148" text-anchor="middle">轨迹诊断 / 编辑提案</text><text class="node-detail" x="595" y="175" text-anchor="middle">从失败与成本定位修改</text><text class="node-detail" x="595" y="197" text-anchor="middle">不把多跑候选当作结构贡献</text></g><g class="architecture-node" data-node="3" data-component="prompt"><rect class="node candidate" x="420" y="330" width="210" height="100" rx="15"/><text class="node-label" x="525" y="363" text-anchor="middle">提示候选</text><text class="node-detail" x="525" y="390" text-anchor="middle">角色、规则与上下文</text></g><g class="architecture-node" data-node="4" data-component="graph"><rect class="node candidate" x="675" y="330" width="210" height="100" rx="15"/><text class="node-label" x="780" y="363" text-anchor="middle">控制图候选</text><text class="node-detail" x="780" y="390" text-anchor="middle">路由、编排与停止</text></g><g class="architecture-node" data-node="5" data-component="code"><rect class="node candidate" x="930" y="330" width="210" height="100" rx="15"/><text class="node-label" x="1035" y="363" text-anchor="middle">代码候选</text><text class="node-detail" x="1035" y="390" text-anchor="middle">工具接口与执行逻辑</text></g><g class="architecture-node" data-node="6" data-component="runner"><rect class="node execution" x="675" y="510" width="300" height="100" rx="15"/><text class="node-label" x="825" y="543" text-anchor="middle">冻结执行器</text><text class="node-detail" x="825" y="570" text-anchor="middle">同任务 / 同模型 / 同预算</text><text class="node-detail" x="825" y="592" text-anchor="middle">各可写面是可选子路线</text></g><g class="architecture-node" data-node="7" data-component="metrics"><rect class="node feedback" x="675" y="660" width="300" height="80" rx="15"/><text class="node-label" x="825" y="687" text-anchor="middle">性能 / 成本向量</text><text class="node-detail" x="825" y="714" text-anchor="middle">显式计入搜索与部署成本</text></g><g class="architecture-node" data-node="8" data-component="selection"><path class="node gate" d="M64 590H276L300 650L276 710H64L40 650Z"/><text class="node-label" x="170" y="623" text-anchor="middle">Pareto / 正则 / 门槛</text><text class="node-detail" x="170" y="650" text-anchor="middle">检查退化与过拟合</text><text class="node-detail" x="170" y="672" text-anchor="middle">并非所有方法使用同一准则</text></g><g class="architecture-node" data-node="9" data-component="lineage"><rect class="node reuse" x="395" y="590" width="210" height="120" rx="15"/><text class="node-label" x="500" y="623" text-anchor="middle">可回滚的版本谱系</text><text class="node-detail" x="500" y="650" text-anchor="middle">新 H 实际装入后续运行</text><text class="node-detail" x="500" y="672" text-anchor="middle">保留失败与拒绝记录</text></g>
<rect x="30" y="790" width="1140" height="86" rx="14" fill="var(--panel,#102238)" stroke="var(--line,#43647f)"/>
<text x="52" y="817" fill="var(--text,#edf5ff)" font-family="system-ui,sans-serif" font-size="14">持久对象：提示、工具接口、上下文策略、控制图、执行代码与候选谱系</text>
<text x="52" y="844" fill="var(--muted,#b8cadb)" font-family="system-ui,sans-serif" font-size="13">常见配置冻结基础模型；评价器、任务与搜索预算必须声明，不应让候选顺手改分数定义。</text>
<text x="600" y="895" text-anchor="middle" fill="var(--muted,#b8cadb)" font-family="system-ui,sans-serif" font-size="12">原创家族架构，不是某篇论文原图；虚线表示可选更新或建议审计，不保证所有方法实现。</text>
</svg>
