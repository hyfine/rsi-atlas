<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="architecture-title-d architecture-desc-d">
<title id="architecture-title-d">D 家族：Harness 与工作流整体思想架构</title>
<desc id="architecture-desc-d">本文原创分类架构，不是某篇论文原图。优化模型外的执行结构：提示、工具、路由、上下文与控制代码；把轨迹诊断转成可评价的系统版本。 提示编辑、图结构搜索、源代码自修改和生产扩展不同；固定外层优化器不自动是元递归。</desc>
<style>.node{fill:var(--node,#152b43);stroke:var(--line,#43647f);stroke-width:1.6}.state,.candidate{stroke:var(--accent,#69d8c8);stroke-width:2.5}.gate{stroke:var(--gold,#ffd08a);stroke-dasharray:6 4}.edge{fill:none;stroke:var(--accent,#69d8c8);stroke-width:2}.advice{stroke:var(--gold,#ffd08a);stroke-dasharray:6 4}.node-label{fill:var(--text,#edf5ff);font:19px system-ui,sans-serif;font-weight:650}.node-detail{fill:var(--muted,#b8cadb);font:14px system-ui,sans-serif}.edge-label{fill:var(--muted,#b8cadb);font:13px system-ui,sans-serif}.selected .node{stroke:var(--focus,#fff);stroke-width:3.5}</style>
<rect width="1200" height="760" rx="20" fill="var(--bg,#0b1727)"/>
<defs><marker id="architecture-arrow-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--accent,#69d8c8)"/></marker></defs>
<text x="600" y="40" text-anchor="middle" fill="var(--text,#edf5ff)" font-family="system-ui,sans-serif" font-size="27" font-weight="700">D 家族 · Harness 与工作流整体思想架构</text>
<text x="600" y="68" text-anchor="middle" fill="var(--muted,#b8cadb)" font-family="system-ui,sans-serif" font-size="14">分类层面的组件与持久状态关系；不是某篇论文算法，也不声称所有方法都实现虚线审计。</text>
<path class="edge" d="M150 170V130H750V170" marker-end="url(#architecture-arrow-d)"/><text class="edge-label" x="690" y="119" text-anchor="middle">任务输入</text>
<path class="edge" d="M570 228H630" marker-end="url(#architecture-arrow-d)"/><text class="edge-label" x="600" y="214" text-anchor="middle">读取</text>
<path class="edge" d="M870 228H930" marker-end="url(#architecture-arrow-d)"/><text class="edge-label" x="900" y="214" text-anchor="middle">反馈</text>
<path class="edge" d="M1050 286V450" marker-end="url(#architecture-arrow-d)"/><text class="edge-label" x="1110" y="372" text-anchor="middle">改进信号</text>
<path class="edge" d="M930 508H870" marker-end="url(#architecture-arrow-d)"/><text class="edge-label" x="900" y="494" text-anchor="middle">提案</text>
<path class="edge" d="M630 508H570" marker-end="url(#architecture-arrow-d)"/><text class="edge-label" x="600" y="494" text-anchor="middle">评价</text>
<path class="edge" d="M330 508H270" marker-end="url(#architecture-arrow-d)"/><text class="edge-label" x="300" y="494" text-anchor="middle">接受</text>
<path class="edge" d="M30 508H15V98H450V170" marker-end="url(#architecture-arrow-d)"/><text class="edge-label" x="700" y="88" text-anchor="middle">持久产物回流：必须真正被下一轮读取</text>
<path class="edge advice" d="M450 450V286" marker-end="url(#architecture-arrow-d)"/><text class="edge-label" x="522" y="372" text-anchor="middle">拒绝时保留旧版</text>
<path d="M438 130H462" fill="none" stroke="var(--bg,#0b1727)" stroke-width="10"/>
<path d="M438 130H462" fill="none" stroke="var(--accent,#69d8c8)" stroke-width="2"/>
<g class="architecture-node" data-node="0"><rect class="node input" x="30" y="170" width="240" height="116" rx="15"/><text class="node-label" x="150" y="206" text-anchor="middle">任务、工具与运行约束</text><text class="node-detail" x="150" y="236" text-anchor="middle">开发任务、权限与预算</text><text class="node-detail" x="150" y="259" text-anchor="middle">分清开发集和最终测试</text></g><g class="architecture-node" data-node="1"><rect class="node state" x="330" y="170" width="240" height="116" rx="15"/><text class="node-label" x="450" y="206" text-anchor="middle">当前 Harness 版本</text><text class="node-detail" x="450" y="236" text-anchor="middle">提示、路由、上下文与代码</text><text class="node-detail" x="450" y="259" text-anchor="middle">H_t 与固定 backbone 配对</text></g><g class="architecture-node" data-node="2"><rect class="node execution" x="630" y="170" width="240" height="116" rx="15"/><text class="node-label" x="750" y="206" text-anchor="middle">模型—工具执行器</text><text class="node-detail" x="750" y="236" text-anchor="middle">按当前控制结构运行</text><text class="node-detail" x="750" y="259" text-anchor="middle">记录实际工具与模型调用</text></g><g class="architecture-node" data-node="3"><rect class="node feedback" x="930" y="170" width="240" height="116" rx="15"/><text class="node-label" x="1050" y="206" text-anchor="middle">轨迹与性能 / 成本</text><text class="node-detail" x="1050" y="236" text-anchor="middle">任务结果、错误与冗余</text><text class="node-detail" x="1050" y="259" text-anchor="middle">自偏好/生成测试各有局限</text></g><g class="architecture-node" data-node="4"><rect class="node updater" x="930" y="450" width="240" height="116" rx="15"/><text class="node-label" x="1050" y="486" text-anchor="middle">诊断与结构提案</text><text class="node-detail" x="1050" y="516" text-anchor="middle">编辑提示、工作流或代码</text><text class="node-detail" x="1050" y="539" text-anchor="middle">修改范围与理由显式化</text></g><g class="architecture-node" data-node="5"><rect class="node candidate" x="630" y="450" width="240" height="116" rx="15"/><text class="node-label" x="750" y="486" text-anchor="middle">候选 Harness 集</text><text class="node-detail" x="750" y="516" text-anchor="middle">H&apos;、diff、配置与执行证据</text><text class="node-detail" x="750" y="539" text-anchor="middle">可包含互补或低成本方案</text></g><g class="architecture-node" data-node="6"><rect class="node gate" x="330" y="450" width="240" height="116" rx="15"/><text class="node-label" x="450" y="486" text-anchor="middle">候选选择与版本管理</text><text class="node-detail" x="450" y="516" text-anchor="middle">可用 Pareto、正则或门槛</text><text class="node-detail" x="450" y="539" text-anchor="middle">最终独立验收不是默认保障</text></g><g class="architecture-node" data-node="7"><rect class="node reuse" x="30" y="450" width="240" height="116" rx="15"/><text class="node-label" x="150" y="486" text-anchor="middle">部署并参与后续运行</text><text class="node-detail" x="150" y="516" text-anchor="middle">新 H 被真实加载使用</text><text class="node-detail" x="150" y="539" text-anchor="middle">还要检查是否进入改进路径</text></g>
<rect x="30" y="623" width="1140" height="109" rx="14" fill="var(--panel,#102238)" stroke="var(--line,#43647f)"/>
<text x="52" y="652" fill="var(--accent,#69d8c8)" font-family="system-ui,sans-serif" font-size="16" font-weight="650">持久状态与边界</text>
<text x="52" y="680" fill="var(--text,#edf5ff)" font-family="system-ui,sans-serif" font-size="14">提示、工具接口、上下文策略、控制图、执行代码与候选谱系</text>
<text x="52" y="708" fill="var(--muted,#b8cadb)" font-family="system-ui,sans-serif" font-size="13">常见配置冻结基础模型；评价器、任务与搜索预算必须声明，不应让候选顺手改分数定义。</text>
</svg>
