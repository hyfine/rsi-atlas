<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" data-topology="independent-evaluation" role="img" aria-labelledby="architecture-title-e architecture-desc-e">
<title id="architecture-title-e">E 家族：评价器与验证过程整体思想架构</title>
<desc id="architecture-desc-e">本文原创分类架构，不是某篇论文原图。研究反馈从哪里来、是否更接近任务目标，以及评价过程能否被改进；不能把自评分上涨当成真值改善。 使用反馈、学习评价器、修改评价规则是三种行为，不是必然依次升级。只使用 V 的方法不走图中的评价器更新支路。</desc>
<style>.node{fill:var(--node,#152b43);stroke:var(--line,#43647f);stroke-width:1.6}.state,.candidate{stroke:var(--accent,#69d8c8);stroke-width:2.5}.gate{stroke:var(--gold,#ffd08a)}.edge{fill:none;stroke:var(--accent,#69d8c8);stroke-width:2}.advice{stroke:var(--gold,#ffd08a);stroke-dasharray:6 4}.node-label{fill:var(--text,#edf5ff);font:20px system-ui,sans-serif;font-weight:650}.node-detail{fill:var(--muted,#b8cadb);font:14px system-ui,sans-serif}.edge-label{fill:var(--muted,#b8cadb);font:13px system-ui,sans-serif}.edge-caption rect{fill:var(--bg,#0b1727)}.selected .node{stroke:var(--focus,#fff);stroke-width:3.5}.database-cap{fill:none;stroke:var(--accent,#69d8c8);stroke-width:1.5}.stack-mark{stroke:var(--accent,#69d8c8);stroke-width:2}.architecture-region rect{fill:var(--panel,#102238);fill-opacity:.6;stroke:var(--line,#43647f);stroke-dasharray:5 6}.architecture-region text{fill:var(--muted,#b8cadb);font:14px system-ui,sans-serif}</style>
<rect width="1200" height="900" rx="20" fill="var(--bg,#0b1727)"/>
<defs><marker id="architecture-arrow-e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--accent,#69d8c8)"/></marker></defs>
<text x="600" y="39" text-anchor="middle" fill="var(--text,#edf5ff)" font-family="system-ui,sans-serif" font-size="26" font-weight="700">E · 开发反馈与独立校准的平行双轨</text>
<text x="600" y="69" text-anchor="middle" fill="var(--muted,#b8cadb)" font-family="system-ui,sans-serif" font-size="14">核心差异：独立锚点不经过候选改进器；评价器更新只是可选支路，不能把评分上涨当成真值改善。</text>
<g class="architecture-region"><rect x="420" y="480" width="750" height="285" rx="20"/><text x="436" y="503">独立校准轨：不交给候选改写的参照</text></g>
<path class="edge" data-from="objective" data-to="judge" d="M340 165L590 165L590 250" marker-end="url(#architecture-arrow-e)"/><g class="edge-caption"><rect x="417" y="130" width="66" height="22" rx="5"/><text class="edge-label" x="450" y="145" text-anchor="middle">目标口径</text></g><path class="edge" data-from="system" data-to="judge" d="M340 390L390 390L390 305L440 305" marker-end="url(#architecture-arrow-e)"/><g class="edge-caption"><rect x="357" y="330" width="66" height="22" rx="5"/><text class="edge-label" x="390" y="345" text-anchor="middle">待判产物</text></g><path class="edge" data-from="system" data-to="anchor" d="M340 390L390 390L390 600L440 600" marker-end="url(#architecture-arrow-e)"/><g class="edge-caption"><rect x="332" y="495" width="66" height="22" rx="5"/><text class="edge-label" x="365" y="510" text-anchor="middle">独立测量</text></g><path class="edge" data-from="judge" data-to="verdict" d="M740 305L850 305" marker-end="url(#architecture-arrow-e)"/><g class="edge-caption"><rect x="775" y="270" width="40" height="22" rx="5"/><text class="edge-label" x="795" y="285" text-anchor="middle">评分</text></g><path class="edge" data-from="anchor" data-to="calibrate" d="M740 600L850 600" marker-end="url(#architecture-arrow-e)"/><g class="edge-caption"><rect x="775" y="565" width="40" height="22" rx="5"/><text class="edge-label" x="795" y="580" text-anchor="middle">真值</text></g><path class="edge" data-from="verdict" data-to="calibrate" d="M1000 360L1000 540" marker-end="url(#architecture-arrow-e)"/><g class="edge-caption"><rect x="1057" y="435" width="66" height="22" rx="5"/><text class="edge-label" x="1090" y="450" text-anchor="middle">对照误差</text></g><path class="edge advice" data-from="calibrate" data-to="update" d="M850 600L795 600L795 727L740 727.5" marker-end="url(#architecture-arrow-e)"/><g class="edge-caption"><rect x="767" y="668" width="66" height="22" rx="5"/><text class="edge-label" x="800" y="683" text-anchor="middle">校准反馈</text></g><path class="edge advice" data-from="update" data-to="judge" d="M440 727.5L420 727L420 460L590 460L590 360" marker-end="url(#architecture-arrow-e)"/><g class="edge-caption"><rect x="533.5" y="428" width="93" height="22" rx="5"/><text class="edge-label" x="580" y="443" text-anchor="middle">允许时更新 V</text></g><path class="edge" data-from="calibrate" data-to="report" d="M1150 600L1175 600L1175 157L1150 157.5" marker-end="url(#architecture-arrow-e)"/><g class="edge-caption"><rect x="1037" y="490" width="66" height="22" rx="5"/><text class="edge-label" x="1070" y="505" text-anchor="middle">独立报告</text></g><path class="edge" data-from="objective" data-to="anchor" d="M340 165L370 165L370 520L590 520L590 540" marker-end="url(#architecture-arrow-e)"/><g class="edge-caption"><rect x="490.5" y="468" width="79" height="22" rx="5"/><text class="edge-label" x="530" y="483" text-anchor="middle">规格与参照</text></g>
<g class="architecture-node" data-node="0" data-component="objective"><rect class="node input" x="40" y="120" width="300" height="90" rx="15"/><text class="node-label" x="190" y="153" text-anchor="middle">受保护的任务目标</text><text class="node-detail" x="190" y="180" text-anchor="middle">规格与外部成功口径</text><text class="node-detail" x="190" y="202" text-anchor="middle">不由候选自行重定义</text></g><g class="architecture-node" data-node="1" data-component="system"><rect class="node execution" x="40" y="330" width="300" height="120" rx="15"/><text class="node-label" x="190" y="363" text-anchor="middle">被评系统与产物</text><text class="node-detail" x="190" y="390" text-anchor="middle">回答、程序或实际行为</text><text class="node-detail" x="190" y="412" text-anchor="middle">生成权不等于最终发布权</text></g><g class="architecture-node" data-node="2" data-component="judge"><rect class="node state" x="440" y="250" width="300" height="110" rx="15"/><text class="node-label" x="590" y="283" text-anchor="middle">当前评价器 V_t</text><text class="node-detail" x="590" y="310" text-anchor="middle">judge、测试或 rubric</text><text class="node-detail" x="590" y="332" text-anchor="middle">只使用反馈时可完全固定</text></g><g class="architecture-node" data-node="3" data-component="verdict"><rect class="node feedback" x="850" y="250" width="300" height="110" rx="15"/><text class="node-label" x="1000" y="283" text-anchor="middle">分数 / 行为判决</text><text class="node-detail" x="1000" y="310" text-anchor="middle">内部偏好不是外部真值</text><text class="node-detail" x="1000" y="332" text-anchor="middle">警惕自我强化的错误</text></g><g class="architecture-node" data-node="4" data-component="anchor"><path class="node input" d="M440 557C440 536 740 536 740 557V643C740 664 440 664 440 643Z"/><ellipse class="database-cap" cx="590" cy="557" rx="150" ry="16"/><text class="node-label" x="590" y="588" text-anchor="middle">独立真值 / 人工锚点</text><text class="node-detail" x="590" y="615" text-anchor="middle">独立观测、校准与保留样本</text><text class="node-detail" x="590" y="637" text-anchor="middle">锚点本身也要说明误差</text></g><g class="architecture-node" data-node="5" data-component="calibrate"><path class="node gate" d="M874 540H1126L1150 600L1126 660H874L850 600Z"/><text class="node-label" x="1000" y="573" text-anchor="middle">误差 / 校准 / 分歧</text><text class="node-detail" x="1000" y="600" text-anchor="middle">误判率、覆盖与偏差</text><text class="node-detail" x="1000" y="622" text-anchor="middle">不得反复暴露最终报告集</text></g><g class="architecture-node" data-node="6" data-component="update"><rect class="node updater" x="440" y="690" width="300" height="75" rx="15"/><text class="node-label" x="590" y="717" text-anchor="middle">可选：评价器更新 V&apos;</text><text class="node-detail" x="590" y="744" text-anchor="middle">仅学习或改规则时进入</text></g><g class="architecture-node" data-node="7" data-component="report"><rect class="node reuse" x="850" y="115" width="300" height="85" rx="15"/><text class="node-label" x="1000" y="148" text-anchor="middle">独立报告 / 发布权限</text><text class="node-detail" x="1000" y="175" text-anchor="middle">验收不等于候选自评分</text></g>
<rect x="30" y="790" width="1140" height="86" rx="14" fill="var(--panel,#102238)" stroke="var(--line,#43647f)"/>
<text x="52" y="817" fill="var(--text,#edf5ff)" font-family="system-ui,sans-serif" font-size="14">持久对象：judge 参数/提示、测试、校准集、rubric 与评价版本；仅使用反馈时 V 可以完全不变</text>
<text x="52" y="844" fill="var(--muted,#b8cadb)" font-family="system-ui,sans-serif" font-size="13">外部锚点、最终报告集与发布权限需要隔离；规格、执行器和人工判断也可能有误差。</text>
<text x="600" y="895" text-anchor="middle" fill="var(--muted,#b8cadb)" font-family="system-ui,sans-serif" font-size="12">原创家族架构，不是某篇论文原图；虚线表示可选更新或建议审计，不保证所有方法实现。</text>
</svg>
