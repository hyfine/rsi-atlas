<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="architecture-title-e architecture-desc-e">
<title id="architecture-title-e">E 家族：评价器与验证过程整体思想架构</title>
<desc id="architecture-desc-e">本文原创分类架构，不是某篇论文原图。研究反馈从哪里来、是否更接近任务目标，以及评价过程能否被改进；不能把自评分上涨当成真值改善。 使用反馈、学习评价器、修改评价规则是三种行为，不是必然依次升级。只使用 V 的方法不走图中的评价器更新支路。</desc>
<style>.node{fill:var(--node,#152b43);stroke:var(--line,#43647f);stroke-width:1.6}.state,.candidate{stroke:var(--accent,#69d8c8);stroke-width:2.5}.gate{stroke:var(--gold,#ffd08a);stroke-dasharray:6 4}.edge{fill:none;stroke:var(--accent,#69d8c8);stroke-width:2}.advice{stroke:var(--gold,#ffd08a);stroke-dasharray:6 4}.node-label{fill:var(--text,#edf5ff);font:19px system-ui,sans-serif;font-weight:650}.node-detail{fill:var(--muted,#b8cadb);font:14px system-ui,sans-serif}.edge-label{fill:var(--muted,#b8cadb);font:13px system-ui,sans-serif}.selected .node{stroke:var(--focus,#fff);stroke-width:3.5}</style>
<rect width="1200" height="760" rx="20" fill="var(--bg,#0b1727)"/>
<defs><marker id="architecture-arrow-e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--accent,#69d8c8)"/></marker></defs>
<text x="600" y="40" text-anchor="middle" fill="var(--text,#edf5ff)" font-family="system-ui,sans-serif" font-size="27" font-weight="700">E 家族 · 评价器与验证过程整体思想架构</text>
<text x="600" y="68" text-anchor="middle" fill="var(--muted,#b8cadb)" font-family="system-ui,sans-serif" font-size="14">分类层面的组件与持久状态关系；不是某篇论文算法，也不声称所有方法都实现虚线审计。</text>
<path class="edge" d="M150 170V130H750V170" marker-end="url(#architecture-arrow-e)"/><text class="edge-label" x="690" y="119" text-anchor="middle">任务输入</text>
<path class="edge" d="M570 228H630" marker-end="url(#architecture-arrow-e)"/><text class="edge-label" x="600" y="214" text-anchor="middle">读取</text>
<path class="edge" d="M870 228H930" marker-end="url(#architecture-arrow-e)"/><text class="edge-label" x="900" y="214" text-anchor="middle">反馈</text>
<path class="edge advice" d="M1050 286V450" marker-end="url(#architecture-arrow-e)"/><text class="edge-label" x="1110" y="372" text-anchor="middle">拟更新 V 时</text>
<path class="edge" d="M930 508H870" marker-end="url(#architecture-arrow-e)"/><text class="edge-label" x="900" y="494" text-anchor="middle">提案</text>
<path class="edge" d="M630 508H570" marker-end="url(#architecture-arrow-e)"/><text class="edge-label" x="600" y="494" text-anchor="middle">评价</text>
<path class="edge" d="M330 508H270" marker-end="url(#architecture-arrow-e)"/><text class="edge-label" x="300" y="494" text-anchor="middle">接受</text>
<path class="edge" d="M30 508H15V98H450V170" marker-end="url(#architecture-arrow-e)"/><text class="edge-label" x="700" y="88" text-anchor="middle">持久产物回流：必须真正被下一轮读取</text>
<path class="edge advice" d="M450 450V286" marker-end="url(#architecture-arrow-e)"/><text class="edge-label" x="522" y="372" text-anchor="middle">拒绝时保留旧版</text>
<path d="M438 130H462" fill="none" stroke="var(--bg,#0b1727)" stroke-width="10"/>
<path d="M438 130H462" fill="none" stroke="var(--accent,#69d8c8)" stroke-width="2"/>
<g class="architecture-node" data-node="0"><rect class="node input" x="30" y="170" width="240" height="116" rx="15"/><text class="node-label" x="150" y="206" text-anchor="middle">目标与外部锚点</text><text class="node-detail" x="150" y="236" text-anchor="middle">规格、执行真值或独立观测</text><text class="node-detail" x="150" y="259" text-anchor="middle">开放任务仍需承认不确定性</text></g><g class="architecture-node" data-node="1"><rect class="node state" x="330" y="170" width="240" height="116" rx="15"/><text class="node-label" x="450" y="206" text-anchor="middle">当前评价状态 V_t</text><text class="node-detail" x="450" y="236" text-anchor="middle">judge、测试与反馈接口</text><text class="node-detail" x="450" y="259" text-anchor="middle">使用反馈时可以始终固定</text></g><g class="architecture-node" data-node="2"><rect class="node execution" x="630" y="170" width="240" height="116" rx="15"/><text class="node-label" x="750" y="206" text-anchor="middle">被评系统与任务执行</text><text class="node-detail" x="750" y="236" text-anchor="middle">候选回答、程序或真实产物</text><text class="node-detail" x="750" y="259" text-anchor="middle">生成权与最终发布权分开</text></g><g class="architecture-node" data-node="3"><rect class="node feedback" x="930" y="170" width="240" height="116" rx="15"/><text class="node-label" x="1050" y="206" text-anchor="middle">判决与观测差异</text><text class="node-detail" x="1050" y="236" text-anchor="middle">自评/外评、错误与分歧</text><text class="node-detail" x="1050" y="259" text-anchor="middle">高一致性不等于高真实性</text></g><g class="architecture-node" data-node="4"><rect class="node updater" x="930" y="450" width="240" height="116" rx="15"/><text class="node-label" x="1050" y="486" text-anchor="middle">反馈构造或校准提案</text><text class="node-detail" x="1050" y="516" text-anchor="middle">仅学习评价器/改规则时进入</text><text class="node-detail" x="1050" y="539" text-anchor="middle">不能为新候选重定义成功</text></g><g class="architecture-node" data-node="5"><rect class="node candidate" x="630" y="450" width="240" height="116" rx="15"/><text class="node-label" x="750" y="486" text-anchor="middle">候选评价配置 V&apos;</text><text class="node-detail" x="750" y="516" text-anchor="middle">奖励、测试、judge 或 rubric</text><text class="node-detail" x="750" y="539" text-anchor="middle">明确哪一项实际发生变化</text></g><g class="architecture-node" data-node="6"><rect class="node gate" x="330" y="450" width="240" height="116" rx="15"/><text class="node-label" x="450" y="486" text-anchor="middle">独立校准与准入</text><text class="node-detail" x="450" y="516" text-anchor="middle">误差、覆盖与偏差检查</text><text class="node-detail" x="450" y="539" text-anchor="middle">受保护审计是建议协议</text></g><g class="architecture-node" data-node="7"><rect class="node reuse" x="30" y="450" width="240" height="116" rx="15"/><text class="node-label" x="150" y="486" text-anchor="middle">后继评分与再审计</text><text class="node-detail" x="150" y="516" text-anchor="middle">获准 V&apos; 用于允许的反馈</text><text class="node-detail" x="150" y="539" text-anchor="middle">最终报告集不反复暴露</text></g>
<rect x="30" y="623" width="1140" height="109" rx="14" fill="var(--panel,#102238)" stroke="var(--line,#43647f)"/>
<text x="52" y="652" fill="var(--accent,#69d8c8)" font-family="system-ui,sans-serif" font-size="16" font-weight="650">持久状态与边界</text>
<text x="52" y="680" fill="var(--text,#edf5ff)" font-family="system-ui,sans-serif" font-size="14">judge 参数/提示、测试、校准集、rubric 与评价版本；仅使用反馈时 V 可以完全不变</text>
<text x="52" y="708" fill="var(--muted,#b8cadb)" font-family="system-ui,sans-serif" font-size="13">外部锚点、最终报告集与发布权限需要隔离；规格、执行器和人工判断也可能有误差。</text>
</svg>
