<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="survey-title-zh"><title id="survey-title-zh">RSI 综述坐标：对象家族不是自治等级</title><rect width="1200" height="820" rx="24" fill="#0b1727"/><g font-family="system-ui,sans-serif"><text x="600" y="45" text-anchor="middle" fill="#edf5ff" font-size="27" font-weight="700">综述不只是一套分类。</text><text x="600" y="79" text-anchor="middle" fill="#b7cbdc" font-size="15">沿多个独立坐标阅读每个方法，不把家族标签换算成智力或自治排名。</text><text x="30" y="123" fill="#76ddce" font-size="16">1 · 究竟改变什么？</text><g><rect x="25" y="142" width="175" height="155" rx="14" fill="#142940" stroke="#43647f"/><text x="42" y="174" fill="#76ddce" font-size="25" font-weight="700">A</text><text x="112" y="205" text-anchor="middle" fill="#edf5ff" font-size="18">模型与训练</text><text x="112" y="241" text-anchor="middle" fill="#b7cbdc" font-size="13">参数与 adapter</text><text x="112" y="264" text-anchor="middle" fill="#b7cbdc" font-size="13">训练配方</text></g><g><rect x="220" y="142" width="175" height="155" rx="14" fill="#142940" stroke="#43647f"/><text x="237" y="174" fill="#76ddce" font-size="25" font-weight="700">B</text><text x="307" y="205" text-anchor="middle" fill="#edf5ff" font-size="18">任务与环境</text><text x="307" y="241" text-anchor="middle" fill="#b7cbdc" font-size="13">任务池与课程</text><text x="307" y="264" text-anchor="middle" fill="#b7cbdc" font-size="13">环境生成器</text></g><g><rect x="415" y="142" width="175" height="155" rx="14" fill="#142940" stroke="#43647f"/><text x="432" y="174" fill="#76ddce" font-size="25" font-weight="700">C</text><text x="502" y="205" text-anchor="middle" fill="#edf5ff" font-size="18">记忆与技能</text><text x="502" y="241" text-anchor="middle" fill="#b7cbdc" font-size="13">经验与过程记忆</text><text x="502" y="264" text-anchor="middle" fill="#b7cbdc" font-size="13">可检索程序工具</text></g><g><rect x="610" y="142" width="175" height="155" rx="14" fill="#142940" stroke="#43647f"/><text x="627" y="174" fill="#76ddce" font-size="25" font-weight="700">D</text><text x="697" y="205" text-anchor="middle" fill="#edf5ff" font-size="18">Harness 与工作流</text><text x="697" y="241" text-anchor="middle" fill="#b7cbdc" font-size="13">运行时与路由</text><text x="697" y="264" text-anchor="middle" fill="#b7cbdc" font-size="13">可编辑控制代码</text></g><g><rect x="805" y="142" width="175" height="155" rx="14" fill="#142940" stroke="#43647f"/><text x="822" y="174" fill="#76ddce" font-size="25" font-weight="700">E</text><text x="892" y="205" text-anchor="middle" fill="#edf5ff" font-size="18">评价机制</text><text x="892" y="241" text-anchor="middle" fill="#b7cbdc" font-size="13">裁判、测试与标准</text><text x="892" y="264" text-anchor="middle" fill="#b7cbdc" font-size="13">校准与验证协议</text></g><g><rect x="1000" y="142" width="175" height="155" rx="14" fill="#142940" stroke="#43647f"/><text x="1017" y="174" fill="#76ddce" font-size="25" font-weight="700">F</text><text x="1087" y="205" text-anchor="middle" fill="#edf5ff" font-size="18">改进器与元过程</text><text x="1087" y="241" text-anchor="middle" fill="#b7cbdc" font-size="13">搜索策略与算子</text><text x="1087" y="264" text-anchor="middle" fill="#b7cbdc" font-size="13">改进机制后继交接</text></g><g><rect x="25" y="327" width="1150" height="80" rx="13" fill="#102238" stroke="#35516c"/><text x="46" y="372" fill="#76ddce" font-size="20" font-weight="650">2 · 改进责任</text><path d="M335 343V391" stroke="#43647f"/><text x="355" y="358" fill="#edf5ff" font-size="15">谁定义目标、提出方案、验证、选择和安装更新？</text><text x="355" y="385" fill="#b7cbdc" font-size="14">人类、混合与系统所有权，不由 A–F 标签决定。</text></g><g><rect x="25" y="422" width="1150" height="80" rx="13" fill="#13283c" stroke="#35516c"/><text x="46" y="467" fill="#76ddce" font-size="20" font-weight="650">3 · 反馈制度</text><path d="M335 438V486" stroke="#43647f"/><text x="355" y="453" fill="#edf5ff" font-size="15">反馈来自哪里？改进器看到了哪些外部或特权信息？</text><text x="355" y="480" fill="#b7cbdc" font-size="14">答案、执行真值、自判断和只在终点评价，是不同信息协议。</text></g><g><rect x="25" y="517" width="1150" height="80" rx="13" fill="#102238" stroke="#35516c"/><text x="46" y="562" fill="#76ddce" font-size="20" font-weight="650">4 · 继承与递归</text><path d="M335 533V581" stroke="#43647f"/><text x="355" y="548" fill="#edf5ff" font-size="15">后继者是否真正读取、激活并执行保留的改变？</text><text x="355" y="575" fill="#b7cbdc" font-size="14">资产保留、结构性递归与有效递归不能互相充当证据。</text></g><g><rect x="25" y="612" width="1150" height="80" rx="13" fill="#13283c" stroke="#35516c"/><text x="46" y="657" fill="#76ddce" font-size="20" font-weight="650">5 · 证据与完整成本</text><path d="M335 628V676" stroke="#43647f"/><text x="355" y="643" fill="#edf5ff" font-size="15">同预算、留出任务、负对照下，收益是否仍然成立？</text><text x="355" y="670" fill="#b7cbdc" font-size="14">任务增益、后继改进效率与全生命周期成本需要分别报告。</text></g><text x="600" y="756" text-anchor="middle" fill="#b7cbdc" font-size="14">AI4AI · Genuine RSI · Self-Developing Agents：问题互补，不是同义分类。</text><text x="600" y="790" text-anchor="middle" fill="#8ea6bb" font-size="13">本图为原创分析坐标，不是性能排名；原文版本、证据范围与限制仍需逐项核对。</text></g></svg>
