<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" data-topology="memory-read-write" role="img" aria-labelledby="architecture-title-c architecture-desc-c">
<title id="architecture-title-c">C 家族：Agent 记忆与技能整体思想架构</title>
<desc id="architecture-desc-c">本文原创分类架构，不是某篇论文原图。把一次执行的经验转成以后可检索、可组合、可验证的资产，减少重复探索；记忆变多并不等于记忆正确。 反思文本、抽象原则和可执行技能不是同一更新；本次上下文修订不自动成为跨任务记忆。</desc>
<style>.node{fill:var(--node,#152b43);stroke:var(--line,#43647f);stroke-width:1.6}.state,.candidate{stroke:var(--accent,#69d8c8);stroke-width:2.5}.gate{stroke:var(--gold,#ffd08a)}.edge{fill:none;stroke:var(--accent,#69d8c8);stroke-width:2}.advice{stroke:var(--gold,#ffd08a);stroke-dasharray:6 4}.node-label{fill:var(--text,#edf5ff);font:20px system-ui,sans-serif;font-weight:650}.node-detail{fill:var(--muted,#b8cadb);font:14px system-ui,sans-serif}.edge-label{fill:var(--muted,#b8cadb);font:13px system-ui,sans-serif}.edge-caption rect{fill:var(--bg,#0b1727)}.selected .node{stroke:var(--focus,#fff);stroke-width:3.5}.database-cap{fill:none;stroke:var(--accent,#69d8c8);stroke-width:1.5}.stack-mark{stroke:var(--accent,#69d8c8);stroke-width:2}.architecture-region rect{fill:var(--panel,#102238);fill-opacity:.6;stroke:var(--line,#43647f);stroke-dasharray:5 6}.architecture-region text{fill:var(--muted,#b8cadb);font:14px system-ui,sans-serif}</style>
<rect width="1200" height="900" rx="20" fill="var(--bg,#0b1727)"/>
<defs><marker id="architecture-arrow-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--accent,#69d8c8)"/></marker></defs>
<text x="600" y="39" text-anchor="middle" fill="var(--text,#edf5ff)" font-family="system-ui,sans-serif" font-size="26" font-weight="700">C · 记忆系统的只读检索与受控写回</text>
<text x="600" y="69" text-anchor="middle" fill="var(--muted,#b8cadb)" font-family="system-ui,sans-serif" font-size="14">核心差异：读路径帮助当次执行；写路径改变未来可检索资产，两条路径不能混同。</text>
<g class="architecture-region"><rect x="410" y="95" width="380" height="215" rx="20"/><text x="426" y="118">持久资产（跨任务）</text></g>
<path class="edge" data-from="query" data-to="retrieve" d="M170 250L170 365" marker-end="url(#architecture-arrow-c)"/><g class="edge-caption"><rect x="142" y="292" width="66" height="22" rx="5"/><text class="edge-label" x="175" y="307" text-anchor="middle">当前任务</text></g><path class="edge" data-from="bank" data-to="retrieve" d="M440 212.5L335 212L335 415L285 415" marker-end="url(#architecture-arrow-c)"/><g class="edge-caption"><rect x="302" y="300" width="66" height="22" rx="5"/><text class="edge-label" x="335" y="315" text-anchor="middle">只读检索</text></g><path class="edge" data-from="retrieve" data-to="execute" d="M285 415L435 420" marker-end="url(#architecture-arrow-c)"/><g class="edge-caption"><rect x="327" y="383" width="66" height="22" rx="5"/><text class="edge-label" x="360" y="398" text-anchor="middle">可用资产</text></g><path class="edge" data-from="execute" data-to="trace" d="M765 420L890 420" marker-end="url(#architecture-arrow-c)"/><g class="edge-caption"><rect x="792" y="388" width="66" height="22" rx="5"/><text class="edge-label" x="825" y="403" text-anchor="middle">执行结果</text></g><path class="edge" data-from="trace" data-to="write" d="M1020 475L1020 590" marker-end="url(#architecture-arrow-c)"/><g class="edge-caption"><rect x="1057" y="525" width="66" height="22" rx="5"/><text class="edge-label" x="1090" y="540" text-anchor="middle">复盘证据</text></g><path class="edge" data-from="write" data-to="commit" d="M890 645L760 645" marker-end="url(#architecture-arrow-c)"/><g class="edge-caption"><rect x="792" y="612" width="66" height="22" rx="5"/><text class="edge-label" x="825" y="627" text-anchor="middle">候选资产</text></g><path class="edge" data-from="commit" data-to="bank" d="M600 700L600 735L1175 735L1175 95L600 95L600 135" marker-end="url(#architecture-arrow-c)"/><g class="edge-caption"><rect x="834.5" y="703" width="191" height="22" rx="5"/><text class="edge-label" x="930" y="718" text-anchor="middle">事务式写回 / 下一任务可检索</text></g>
<g class="architecture-node" data-node="0" data-component="query"><rect class="node input" x="55" y="150" width="230" height="100" rx="15"/><text class="node-label" x="170" y="183" text-anchor="middle">新任务 / 可用工具</text><text class="node-detail" x="170" y="210" text-anchor="middle">用户目标与环境约束</text><text class="node-detail" x="170" y="232" text-anchor="middle">不能假定记忆总是适用</text></g><g class="architecture-node" data-node="1" data-component="bank"><path class="node state" d="M440 152C440 131 760 131 760 152V273C760 294 440 294 440 273Z"/><ellipse class="database-cap" cx="600" cy="152" rx="160" ry="16"/><text class="node-label" x="600" y="183" text-anchor="middle">持久记忆与技能库</text><text class="node-detail" x="600" y="210" text-anchor="middle">原则、经验、可执行工具</text><text class="node-detail" x="600" y="232" text-anchor="middle">来源、版本与适用条件</text></g><g class="architecture-node" data-node="2" data-component="retrieve"><rect class="node execution" x="55" y="365" width="230" height="100" rx="15"/><text class="node-label" x="170" y="398" text-anchor="middle">适用性检索</text><text class="node-detail" x="170" y="425" text-anchor="middle">选择而非全量塞入上下文</text><text class="node-detail" x="170" y="447" text-anchor="middle">显式计算检索成本</text></g><g class="architecture-node" data-node="3" data-component="execute"><rect class="node execution" x="435" y="365" width="330" height="110" rx="15"/><text class="node-label" x="600" y="398" text-anchor="middle">Agent 执行 / 工具</text><text class="node-detail" x="600" y="425" text-anchor="middle">组合旧技能与当前推理</text><text class="node-detail" x="600" y="447" text-anchor="middle">读路径不等于资产更新</text></g><g class="architecture-node" data-node="4" data-component="trace"><rect class="node feedback" x="890" y="365" width="260" height="110" rx="15"/><text class="node-label" x="1020" y="398" text-anchor="middle">结果与失败轨迹</text><text class="node-detail" x="1020" y="425" text-anchor="middle">执行、功能与目标反馈</text><text class="node-detail" x="1020" y="447" text-anchor="middle">不只保存成功故事</text></g><g class="architecture-node" data-node="5" data-component="write"><rect class="node updater" x="890" y="590" width="260" height="110" rx="15"/><text class="node-label" x="1020" y="623" text-anchor="middle">反思 / 技能生成</text><text class="node-detail" x="1020" y="650" text-anchor="middle">提炼原则或生成程序</text><text class="node-detail" x="1020" y="672" text-anchor="middle">候选经验也可能有错</text></g><g class="architecture-node" data-node="6" data-component="commit"><path class="node gate" d="M464 590H736L760 645L736 700H464L440 645Z"/><text class="node-label" x="600" y="623" text-anchor="middle">验证 / 合并 / 退休</text><text class="node-detail" x="600" y="650" text-anchor="middle">测试适用性与负迁移</text><text class="node-detail" x="600" y="672" text-anchor="middle">允许拒绝、修订和删除</text></g>
<rect x="30" y="790" width="1140" height="86" rx="14" fill="var(--panel,#102238)" stroke="var(--line,#43647f)"/>
<text x="52" y="817" fill="var(--text,#edf5ff)" font-family="system-ui,sans-serif" font-size="14">持久对象：反思、经验原则、技能库、可执行工具与检索索引</text>
<text x="52" y="844" fill="var(--muted,#b8cadb)" font-family="system-ui,sans-serif" font-size="13">常见配置固定模型与执行框架；Skill1/COS-PLAY 等 A+C 方法还包含参数学习，需单独标注。</text>
<text x="600" y="895" text-anchor="middle" fill="var(--muted,#b8cadb)" font-family="system-ui,sans-serif" font-size="12">原创家族架构，不是某篇论文原图；虚线表示可选更新或建议审计，不保证所有方法实现。</text>
</svg>
