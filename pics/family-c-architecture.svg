<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="architecture-title-c architecture-desc-c">
<title id="architecture-title-c">C 家族：Agent 记忆与技能整体思想架构</title>
<desc id="architecture-desc-c">本文原创分类架构，不是某篇论文原图。把一次执行的经验转成以后可检索、可组合、可验证的资产，减少重复探索；记忆变多并不等于记忆正确。 反思文本、抽象原则和可执行技能不是同一更新；本次上下文修订不自动成为跨任务记忆。</desc>
<style>.node{fill:var(--node,#152b43);stroke:var(--line,#43647f);stroke-width:1.6}.state,.candidate{stroke:var(--accent,#69d8c8);stroke-width:2.5}.gate{stroke:var(--gold,#ffd08a);stroke-dasharray:6 4}.edge{fill:none;stroke:var(--accent,#69d8c8);stroke-width:2}.advice{stroke:var(--gold,#ffd08a);stroke-dasharray:6 4}.node-label{fill:var(--text,#edf5ff);font:19px system-ui,sans-serif;font-weight:650}.node-detail{fill:var(--muted,#b8cadb);font:14px system-ui,sans-serif}.edge-label{fill:var(--muted,#b8cadb);font:13px system-ui,sans-serif}.selected .node{stroke:var(--focus,#fff);stroke-width:3.5}</style>
<rect width="1200" height="760" rx="20" fill="var(--bg,#0b1727)"/>
<defs><marker id="architecture-arrow-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--accent,#69d8c8)"/></marker></defs>
<text x="600" y="40" text-anchor="middle" fill="var(--text,#edf5ff)" font-family="system-ui,sans-serif" font-size="27" font-weight="700">C 家族 · Agent 记忆与技能整体思想架构</text>
<text x="600" y="68" text-anchor="middle" fill="var(--muted,#b8cadb)" font-family="system-ui,sans-serif" font-size="14">分类层面的组件与持久状态关系；不是某篇论文算法，也不声称所有方法都实现虚线审计。</text>
<path class="edge" d="M150 170V130H750V170" marker-end="url(#architecture-arrow-c)"/><text class="edge-label" x="690" y="119" text-anchor="middle">任务输入</text>
<path class="edge" d="M570 228H630" marker-end="url(#architecture-arrow-c)"/><text class="edge-label" x="600" y="214" text-anchor="middle">读取</text>
<path class="edge" d="M870 228H930" marker-end="url(#architecture-arrow-c)"/><text class="edge-label" x="900" y="214" text-anchor="middle">反馈</text>
<path class="edge" d="M1050 286V450" marker-end="url(#architecture-arrow-c)"/><text class="edge-label" x="1110" y="372" text-anchor="middle">改进信号</text>
<path class="edge" d="M930 508H870" marker-end="url(#architecture-arrow-c)"/><text class="edge-label" x="900" y="494" text-anchor="middle">提案</text>
<path class="edge" d="M630 508H570" marker-end="url(#architecture-arrow-c)"/><text class="edge-label" x="600" y="494" text-anchor="middle">评价</text>
<path class="edge" d="M330 508H270" marker-end="url(#architecture-arrow-c)"/><text class="edge-label" x="300" y="494" text-anchor="middle">接受</text>
<path class="edge" d="M30 508H15V98H450V170" marker-end="url(#architecture-arrow-c)"/><text class="edge-label" x="700" y="88" text-anchor="middle">持久产物回流：必须真正被下一轮读取</text>
<path class="edge advice" d="M450 450V286" marker-end="url(#architecture-arrow-c)"/><text class="edge-label" x="522" y="372" text-anchor="middle">拒绝时保留旧版</text>
<path d="M438 130H462" fill="none" stroke="var(--bg,#0b1727)" stroke-width="10"/>
<path d="M438 130H462" fill="none" stroke="var(--accent,#69d8c8)" stroke-width="2"/>
<g class="architecture-node" data-node="0"><rect class="node input" x="30" y="170" width="240" height="116" rx="15"/><text class="node-label" x="150" y="206" text-anchor="middle">任务与环境反馈入口</text><text class="node-detail" x="150" y="236" text-anchor="middle">新任务、工具与原始轨迹</text><text class="node-detail" x="150" y="259" text-anchor="middle">记录真实失败原因</text></g><g class="architecture-node" data-node="1"><rect class="node state" x="330" y="170" width="240" height="116" rx="15"/><text class="node-label" x="450" y="206" text-anchor="middle">持久记忆 / 技能库</text><text class="node-detail" x="450" y="236" text-anchor="middle">经验、原则、工具程序</text><text class="node-detail" x="450" y="259" text-anchor="middle">含来源与适用条件</text></g><g class="architecture-node" data-node="2"><rect class="node execution" x="630" y="170" width="240" height="116" rx="15"/><text class="node-label" x="750" y="206" text-anchor="middle">检索与 Agent 执行</text><text class="node-detail" x="750" y="236" text-anchor="middle">读取旧资产并组合操作</text><text class="node-detail" x="750" y="259" text-anchor="middle">必要时调用外部工具</text></g><g class="architecture-node" data-node="3"><rect class="node feedback" x="930" y="170" width="240" height="116" rx="15"/><text class="node-label" x="1050" y="206" text-anchor="middle">执行与任务反馈</text><text class="node-detail" x="1050" y="236" text-anchor="middle">异常、功能结果与目标检查</text><text class="node-detail" x="1050" y="259" text-anchor="middle">三种成功语义不能混用</text></g><g class="architecture-node" data-node="4"><rect class="node updater" x="930" y="450" width="240" height="116" rx="15"/><text class="node-label" x="1050" y="486" text-anchor="middle">提炼 / 生成 / 整合</text><text class="node-detail" x="1050" y="516" text-anchor="middle">反思、技能生成与去重</text><text class="node-detail" x="1050" y="539" text-anchor="middle">不是任意错误都要加工具</text></g><g class="architecture-node" data-node="5"><rect class="node candidate" x="630" y="450" width="240" height="116" rx="15"/><text class="node-label" x="750" y="486" text-anchor="middle">候选记忆与技能</text><text class="node-detail" x="750" y="516" text-anchor="middle">文本、程序与索引更新</text><text class="node-detail" x="750" y="539" text-anchor="middle">错误资产也可能被生成</text></g><g class="architecture-node" data-node="6"><rect class="node gate" x="330" y="450" width="240" height="116" rx="15"/><text class="node-label" x="450" y="486" text-anchor="middle">校验与资产版本化</text><text class="node-detail" x="450" y="516" text-anchor="middle">功能、适用性与回归检查</text><text class="node-detail" x="450" y="539" text-anchor="middle">保留拒绝、删除与负例</text></g><g class="architecture-node" data-node="7"><rect class="node reuse" x="30" y="450" width="240" height="116" rx="15"/><text class="node-label" x="150" y="486" text-anchor="middle">后续任务实际复用</text><text class="node-detail" x="150" y="516" text-anchor="middle">跨任务检索与技能组合</text><text class="node-detail" x="150" y="539" text-anchor="middle">是否助力新改进另需举证</text></g>
<rect x="30" y="623" width="1140" height="109" rx="14" fill="var(--panel,#102238)" stroke="var(--line,#43647f)"/>
<text x="52" y="652" fill="var(--accent,#69d8c8)" font-family="system-ui,sans-serif" font-size="16" font-weight="650">持久状态与边界</text>
<text x="52" y="680" fill="var(--text,#edf5ff)" font-family="system-ui,sans-serif" font-size="14">反思、经验原则、技能库、可执行工具与检索索引</text>
<text x="52" y="708" fill="var(--muted,#b8cadb)" font-family="system-ui,sans-serif" font-size="13">常见配置固定模型与执行框架；Skill1/COS-PLAY 等 A+C 方法还包含参数学习，需单独标注。</text>
</svg>
