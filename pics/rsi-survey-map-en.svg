<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="survey-title-en"><title id="survey-title-en">RSI survey coordinates: object families are not autonomy levels</title><rect width="1200" height="820" rx="24" fill="#0b1727"/><g font-family="system-ui,sans-serif"><text x="600" y="45" text-anchor="middle" fill="#edf5ff" font-size="27" font-weight="700">A survey is more than a taxonomy.</text><text x="600" y="79" text-anchor="middle" fill="#b7cbdc" font-size="15">Read each method along independent coordinates; never convert family labels into intelligence or autonomy ranks.</text><text x="30" y="123" fill="#76ddce" font-size="16">1 · WHAT CHANGES?</text><g><rect x="25" y="142" width="175" height="155" rx="14" fill="#142940" stroke="#43647f"/><text x="42" y="174" fill="#76ddce" font-size="25" font-weight="700">A</text><text x="112" y="205" text-anchor="middle" fill="#edf5ff" font-size="15">Models / training</text><text x="112" y="241" text-anchor="middle" fill="#b7cbdc" font-size="13">Parameters / adapters</text><text x="112" y="264" text-anchor="middle" fill="#b7cbdc" font-size="13">Training recipes</text></g><g><rect x="220" y="142" width="175" height="155" rx="14" fill="#142940" stroke="#43647f"/><text x="237" y="174" fill="#76ddce" font-size="25" font-weight="700">B</text><text x="307" y="205" text-anchor="middle" fill="#edf5ff" font-size="15">Data / environments</text><text x="307" y="241" text-anchor="middle" fill="#b7cbdc" font-size="13">Tasks and curricula</text><text x="307" y="264" text-anchor="middle" fill="#b7cbdc" font-size="13">Environment generators</text></g><g><rect x="415" y="142" width="175" height="155" rx="14" fill="#142940" stroke="#43647f"/><text x="432" y="174" fill="#76ddce" font-size="25" font-weight="700">C</text><text x="502" y="205" text-anchor="middle" fill="#edf5ff" font-size="15">Memory / skills</text><text x="502" y="241" text-anchor="middle" fill="#b7cbdc" font-size="13">Experience / procedures</text><text x="502" y="264" text-anchor="middle" fill="#b7cbdc" font-size="13">Retrievable tools</text></g><g><rect x="610" y="142" width="175" height="155" rx="14" fill="#142940" stroke="#43647f"/><text x="627" y="174" fill="#76ddce" font-size="25" font-weight="700">D</text><text x="697" y="205" text-anchor="middle" fill="#edf5ff" font-size="15">Harness / workflows</text><text x="697" y="241" text-anchor="middle" fill="#b7cbdc" font-size="13">Runtime and routing</text><text x="697" y="264" text-anchor="middle" fill="#b7cbdc" font-size="13">Editable control code</text></g><g><rect x="805" y="142" width="175" height="155" rx="14" fill="#142940" stroke="#43647f"/><text x="822" y="174" fill="#76ddce" font-size="25" font-weight="700">E</text><text x="892" y="205" text-anchor="middle" fill="#edf5ff" font-size="15">Evaluation</text><text x="892" y="241" text-anchor="middle" fill="#b7cbdc" font-size="13">Judges / tests / rubrics</text><text x="892" y="264" text-anchor="middle" fill="#b7cbdc" font-size="13">Calibration protocols</text></g><g><rect x="1000" y="142" width="175" height="155" rx="14" fill="#142940" stroke="#43647f"/><text x="1017" y="174" fill="#76ddce" font-size="25" font-weight="700">F</text><text x="1087" y="205" text-anchor="middle" fill="#edf5ff" font-size="15">Meta-improvement</text><text x="1087" y="241" text-anchor="middle" fill="#b7cbdc" font-size="13">Search / operators</text><text x="1087" y="264" text-anchor="middle" fill="#b7cbdc" font-size="13">Successor handoff</text></g><g><rect x="25" y="327" width="1150" height="80" rx="13" fill="#102238" stroke="#35516c"/><text x="46" y="372" fill="#76ddce" font-size="20" font-weight="650">2 · Responsibility</text><path d="M335 343V391" stroke="#43647f"/><text x="355" y="358" fill="#edf5ff" font-size="15">Who defines, proposes, tests, selects and installs the update?</text><text x="355" y="385" fill="#b7cbdc" font-size="14">Human, mixed and system ownership are separate from update targets.</text></g><g><rect x="25" y="422" width="1150" height="80" rx="13" fill="#13283c" stroke="#35516c"/><text x="46" y="467" fill="#76ddce" font-size="20" font-weight="650">3 · Feedback regime</text><path d="M335 438V486" stroke="#43647f"/><text x="355" y="453" fill="#edf5ff" font-size="15">Where does feedback come from, and what information is visible?</text><text x="355" y="480" fill="#b7cbdc" font-size="14">Answers, execution, self-judgment and final-only audits differ.</text></g><g><rect x="25" y="517" width="1150" height="80" rx="13" fill="#102238" stroke="#35516c"/><text x="46" y="562" fill="#76ddce" font-size="20" font-weight="650">4 · Inheritance</text><path d="M335 533V581" stroke="#43647f"/><text x="355" y="548" fill="#edf5ff" font-size="15">Does a successor actually read, activate and execute the retained change?</text><text x="355" y="575" fill="#b7cbdc" font-size="14">Artifact retention, structural recursion and effective recursion are distinct.</text></g><g><rect x="25" y="612" width="1150" height="80" rx="13" fill="#13283c" stroke="#35516c"/><text x="46" y="657" fill="#76ddce" font-size="20" font-weight="650">5 · Evidence / cost</text><path d="M335 628V676" stroke="#43647f"/><text x="355" y="643" fill="#edf5ff" font-size="15">Does improvement survive matched budgets, held-out tasks and negative controls?</text><text x="355" y="670" fill="#b7cbdc" font-size="14">Task gains, future improvement efficiency and lifecycle cost must be separated.</text></g><text x="600" y="756" text-anchor="middle" fill="#b7cbdc" font-size="14">AI4AI · Genuine RSI · Self-Developing Agents — complementary questions, not equivalent classifications.</text><text x="600" y="790" text-anchor="middle" fill="#8ea6bb" font-size="13">Original analytical map · no performance ranking · primary-source scope and limitations remain explicit.</text></g></svg>
