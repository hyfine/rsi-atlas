<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="490" viewBox="0 0 1440 490" role="img" aria-labelledby="title desc"><title id="title">RSI Atlas — beyond a better answer, a better improver</title><desc id="desc">Bilingual source-grounded research map, 88 curated records, six families and institution-aware timelines. Conceptual motion is not an experiment.</desc><defs><linearGradient id="background" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#123335"/></linearGradient><radialGradient id="glow"><stop stop-color="#58d8c1" stop-opacity=".19"/><stop offset="1" stop-color="#58d8c1" stop-opacity="0"/></radialGradient><pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#8ac4cc" stroke-opacity=".07"/></pattern></defs><style>@keyframes orbit{to{stroke-dashoffset:-96}}@keyframes pulse{50%{opacity:.55}}.orbit{animation:orbit 12s linear infinite}.pulse{animation:pulse 4s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.orbit,.pulse{animation:none}}</style><rect width="1440" height="490" rx="26" fill="url(#background)"/><rect width="1440" height="490" rx="26" fill="url(#grid)"/><circle cx="1120" cy="230" r="290" fill="url(#glow)"/><g fill="none" stroke="#69d8c8"><circle cx="1130" cy="225" r="150" opacity=".25"/><circle class="orbit" cx="1130" cy="225" r="185" stroke-dasharray="7 17" opacity=".65"/><path d="M1075 193L1130 160L1185 193V257L1130 290L1075 257Z" fill="#122638"/><path d="M1050 179L1130 132L1210 179V272L1130 319L1050 272Z" opacity=".4"/></g><g font-family="system-ui,sans-serif"><text x="70" y="77" fill="#74dfca" font-size="16" letter-spacing="4">RESEARCH / SYSTEMS / EVIDENCE</text><text x="65" y="168" fill="#edf5ff" font-size="76" font-weight="750">RSI Atlas</text><text x="70" y="229" fill="#edf5ff" font-size="34">Beyond a better answer.</text><text x="70" y="277" fill="#74dfca" font-size="38" font-style="italic">A better improver.</text><text x="70" y="324" fill="#b9c9d9" font-size="20">Mechanisms, primary sources, persistent state — and the limits of evidence.</text><text x="1130" y="238" text-anchor="middle" fill="#edf5ff" font-size="34">RSI</text><text x="1130" y="43" text-anchor="middle" fill="#9eb8c9" font-size="13">CONCEPTUAL FEEDBACK / NOT A RUN</text><circle class="pulse" cx="1130" cy="61" r="4" fill="#74dfca"/><text x="1130" y="87" text-anchor="middle" fill="#b9c9d9" font-size="13">OBSERVE</text><circle class="pulse" cx="1310" cy="209" r="4" fill="#74dfca"/><text x="1310" y="235" text-anchor="middle" fill="#b9c9d9" font-size="13">PROPOSE</text><circle class="pulse" cx="1130" cy="370" r="4" fill="#74dfca"/><text x="1130" y="396" text-anchor="middle" fill="#b9c9d9" font-size="13">EVALUATE</text><circle class="pulse" cx="944" cy="209" r="4" fill="#74dfca"/><text x="944" y="235" text-anchor="middle" fill="#b9c9d9" font-size="13">RETAIN</text><path d="M70 357H1370" stroke="#2b485b"/><text x="70" y="408" fill="#edf5ff" font-size="30" font-weight="650">88</text><text x="70" y="440" fill="#9eb8c9" font-size="13" letter-spacing="1">CURATED RECORDS</text><text x="407" y="408" fill="#edf5ff" font-size="30" font-weight="650">58</text><text x="407" y="440" fill="#9eb8c9" font-size="13" letter-spacing="1">DATED IN LAST 12 MONTHS</text><text x="744" y="408" fill="#edf5ff" font-size="30" font-weight="650">88</text><text x="744" y="440" fill="#9eb8c9" font-size="13" letter-spacing="1">PRIMARY-ATTRIBUTED RECORDS</text><text x="1081" y="408" fill="#edf5ff" font-size="30" font-weight="650">2026-11-06</text><text x="1081" y="440" fill="#9eb8c9" font-size="13" letter-spacing="1">PUBLIC SNAPSHOT</text></g></svg>
