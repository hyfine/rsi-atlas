<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="architecture-title-f architecture-desc-f">
<title id="architecture-title-f">F 家族：AI 研发与元改进整体思想架构</title>
<desc id="architecture-desc-f">本文原创分类架构，不是某篇论文原图。把研究、搜索、提案、选择或预算机制也当作候选对象；关键证据是新改进器实际接管下一轮，而非只多生成一份程序。 自动研发、系统递归、改进器递归分开；若 I 不变，可以有系统反馈，但不能称 I 已自我演化。</desc>
<style>.node{fill:var(--node,#152b43);stroke:var(--line,#43647f);stroke-width:1.6}.state,.candidate{stroke:var(--accent,#69d8c8);stroke-width:2.5}.gate{stroke:var(--gold,#ffd08a);stroke-dasharray:6 4}.edge{fill:none;stroke:var(--accent,#69d8c8);stroke-width:2}.advice{stroke:var(--gold,#ffd08a);stroke-dasharray:6 4}.node-label{fill:var(--text,#edf5ff);font:19px system-ui,sans-serif;font-weight:650}.node-detail{fill:var(--muted,#b8cadb);font:14px system-ui,sans-serif}.edge-label{fill:var(--muted,#b8cadb);font:13px system-ui,sans-serif}.selected .node{stroke:var(--focus,#fff);stroke-width:3.5}</style>
<rect width="1200" height="760" rx="20" fill="var(--bg,#0b1727)"/>
<defs><marker id="architecture-arrow-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--accent,#69d8c8)"/></marker></defs>
<text x="600" y="40" text-anchor="middle" fill="var(--text,#edf5ff)" font-family="system-ui,sans-serif" font-size="27" font-weight="700">F 家族 · AI 研发与元改进整体思想架构</text>
<text x="600" y="68" text-anchor="middle" fill="var(--muted,#b8cadb)" font-family="system-ui,sans-serif" font-size="14">分类层面的组件与持久状态关系；不是某篇论文算法，也不声称所有方法都实现虚线审计。</text>
<path class="edge" d="M150 170V130H750V170" marker-end="url(#architecture-arrow-f)"/><text class="edge-label" x="690" y="119" text-anchor="middle">任务输入</text>
<path class="edge" d="M570 228H630" marker-end="url(#architecture-arrow-f)"/><text class="edge-label" x="600" y="214" text-anchor="middle">读取</text>
<path class="edge" d="M870 228H930" marker-end="url(#architecture-arrow-f)"/><text class="edge-label" x="900" y="214" text-anchor="middle">反馈</text>
<path class="edge" d="M1050 286V450" marker-end="url(#architecture-arrow-f)"/><text class="edge-label" x="1110" y="372" text-anchor="middle">改进信号</text>
<path class="edge" d="M930 508H870" marker-end="url(#architecture-arrow-f)"/><text class="edge-label" x="900" y="494" text-anchor="middle">提案</text>
<path class="edge" d="M630 508H570" marker-end="url(#architecture-arrow-f)"/><text class="edge-label" x="600" y="494" text-anchor="middle">评价</text>
<path class="edge" d="M330 508H270" marker-end="url(#architecture-arrow-f)"/><text class="edge-label" x="300" y="494" text-anchor="middle">接受</text>
<path class="edge" d="M30 508H15V98H450V170" marker-end="url(#architecture-arrow-f)"/><text class="edge-label" x="700" y="88" text-anchor="middle">持久产物回流：必须真正被下一轮读取</text>
<path class="edge advice" d="M450 450V286" marker-end="url(#architecture-arrow-f)"/><text class="edge-label" x="522" y="372" text-anchor="middle">拒绝时保留旧版</text>
<path d="M438 130H462" fill="none" stroke="var(--bg,#0b1727)" stroke-width="10"/>
<path d="M438 130H462" fill="none" stroke="var(--accent,#69d8c8)" stroke-width="2"/>
<g class="architecture-node" data-node="0"><rect class="node input" x="30" y="170" width="240" height="116" rx="15"/><text class="node-label" x="150" y="206" text-anchor="middle">目标系统与研究问题</text><text class="node-detail" x="150" y="236" text-anchor="middle">S_t、任务与可写对象</text><text class="node-detail" x="150" y="259" text-anchor="middle">提出可反驳的改进目标</text></g><g class="architecture-node" data-node="1"><rect class="node state" x="330" y="170" width="240" height="116" rx="15"/><text class="node-label" x="450" y="206" text-anchor="middle">当前研究 / 改进器 I_t</text><text class="node-detail" x="450" y="236" text-anchor="middle">提案、实验、选择与预算策略</text><text class="node-detail" x="450" y="259" text-anchor="middle">区分固定与允许编辑部分</text></g><g class="architecture-node" data-node="2"><rect class="node execution" x="630" y="170" width="240" height="116" rx="15"/><text class="node-label" x="750" y="206" text-anchor="middle">受控实验与候选执行</text><text class="node-detail" x="750" y="236" text-anchor="middle">研究代理调用工具和环境</text><text class="node-detail" x="750" y="259" text-anchor="middle">保存源码、条件与成本</text></g><g class="architecture-node" data-node="3"><rect class="node feedback" x="930" y="170" width="240" height="116" rx="15"/><text class="node-label" x="1050" y="206" text-anchor="middle">可核验证据与失败</text><text class="node-detail" x="1050" y="236" text-anchor="middle">外部任务结果与独立观测</text><text class="node-detail" x="1050" y="259" text-anchor="middle">保留低分、失败和未知</text></g><g class="architecture-node" data-node="4"><rect class="node updater" x="930" y="450" width="240" height="116" rx="15"/><text class="node-label" x="1050" y="486" text-anchor="middle">元提案 / 调度改进</text><text class="node-detail" x="1050" y="516" text-anchor="middle">修改产生后续改进的机制</text><text class="node-detail" x="1050" y="539" text-anchor="middle">自动研发也可能保持 I 固定</text></g><g class="architecture-node" data-node="5"><rect class="node candidate" x="630" y="450" width="240" height="116" rx="15"/><text class="node-label" x="750" y="486" text-anchor="middle">候选 S&apos; 与 I&apos;</text><text class="node-detail" x="750" y="516" text-anchor="middle">目标产物和改进器分别版本化</text><text class="node-detail" x="750" y="539" text-anchor="middle">代码存在不等于交接完成</text></g><g class="architecture-node" data-node="6"><rect class="node gate" x="330" y="450" width="240" height="116" rx="15"/><text class="node-label" x="450" y="486" text-anchor="middle">继续实验与安装判定</text><text class="node-detail" x="450" y="516" text-anchor="middle">同起点/同预算的贡献审计</text><text class="node-detail" x="450" y="539" text-anchor="middle">拒绝时保留旧系统与机制</text></g><g class="architecture-node" data-node="7"><rect class="node reuse" x="30" y="450" width="240" height="116" rx="15"/><text class="node-label" x="150" y="486" text-anchor="middle">新改进器实际接管</text><text class="node-detail" x="150" y="516" text-anchor="middle">I&apos; 进入下一次改进调用</text><text class="node-detail" x="150" y="539" text-anchor="middle">结构交接与收益分别举证</text></g>
<rect x="30" y="623" width="1140" height="109" rx="14" fill="var(--panel,#102238)" stroke="var(--line,#43647f)"/>
<text x="52" y="652" fill="var(--accent,#69d8c8)" font-family="system-ui,sans-serif" font-size="16" font-weight="650">持久状态与边界</text>
<text x="52" y="680" fill="var(--text,#edf5ff)" font-family="system-ui,sans-serif" font-size="14">目标系统 S、改进器 I、实验策略、调度、算子、证据与谱系</text>
<text x="52" y="708" fill="var(--muted,#b8cadb)" font-family="system-ui,sans-serif" font-size="13">最外层控制、评价或基础模型常仍固定；理论可证明自修改与经验搜索不是同一种保证。</text>
</svg>
