<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" data-topology="meta-improver-stack" role="img" aria-labelledby="architecture-title-f architecture-desc-f">
<title id="architecture-title-f">F 家族：AI 研发与元改进整体思想架构</title>
<desc id="architecture-desc-f">本文原创分类架构，不是某篇论文原图。把研究、搜索、提案、选择或预算机制也当作候选对象；关键证据是新改进器实际接管下一轮，而非只多生成一份程序。 自动研发、系统递归、改进器递归分开；若 I 不变，可以有系统反馈，但不能称 I 已自我演化。</desc>
<style>.node{fill:var(--node,#152b43);stroke:var(--line,#43647f);stroke-width:1.6}.state,.candidate{stroke:var(--accent,#69d8c8);stroke-width:2.5}.gate{stroke:var(--gold,#ffd08a)}.edge{fill:none;stroke:var(--accent,#69d8c8);stroke-width:2}.advice{stroke:var(--gold,#ffd08a);stroke-dasharray:6 4}.node-label{fill:var(--text,#edf5ff);font:20px system-ui,sans-serif;font-weight:650}.node-detail{fill:var(--muted,#b8cadb);font:14px system-ui,sans-serif}.edge-label{fill:var(--muted,#b8cadb);font:13px system-ui,sans-serif}.edge-caption rect{fill:var(--bg,#0b1727)}.selected .node{stroke:var(--focus,#fff);stroke-width:3.5}.database-cap{fill:none;stroke:var(--accent,#69d8c8);stroke-width:1.5}.stack-mark{stroke:var(--accent,#69d8c8);stroke-width:2}.architecture-region rect{fill:var(--panel,#102238);fill-opacity:.6;stroke:var(--line,#43647f);stroke-dasharray:5 6}.architecture-region text{fill:var(--muted,#b8cadb);font:14px system-ui,sans-serif}</style>
<rect width="1200" height="900" rx="20" fill="var(--bg,#0b1727)"/>
<defs><marker id="architecture-arrow-f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--accent,#69d8c8)"/></marker></defs>
<text x="600" y="39" text-anchor="middle" fill="var(--text,#edf5ff)" font-family="system-ui,sans-serif" font-size="26" font-weight="700">F · 目标系统—改进器—元控制的分层递归</text>
<text x="600" y="69" text-anchor="middle" fill="var(--muted,#b8cadb)" font-family="system-ui,sans-serif" font-size="14">核心差异：改进器本身成为可更新资产；必须证明接管与后续效用，而不只证明任务分数上涨。</text>
<g class="architecture-region"><rect x="420" y="95" width="380" height="165" rx="20"/><text x="436" y="118">外层：可能仍固定</text></g><g class="architecture-region"><rect x="420" y="295" width="380" height="175" rx="20"/><text x="436" y="318">改进层 / I_t</text></g><g class="architecture-region"><rect x="420" y="510" width="380" height="175" rx="20"/><text x="436" y="533">任务层：求解与执行</text></g>
<path class="edge" data-from="objective" data-to="meta" d="M300 190L440 190" marker-end="url(#architecture-arrow-f)"/><g class="edge-caption"><rect x="326.5" y="158" width="87" height="22" rx="5"/><text class="edge-label" x="370" y="173" text-anchor="middle">目标 / 约束</text></g><path class="edge" data-from="meta" data-to="improver" d="M610 240L610 340" marker-end="url(#architecture-arrow-f)"/><g class="edge-caption"><rect x="656.5" y="272" width="87" height="22" rx="5"/><text class="edge-label" x="700" y="287" text-anchor="middle">调度 / 提案</text></g><path class="edge" data-from="improver" data-to="system" d="M610 450L610 555" marker-end="url(#architecture-arrow-f)"/><g class="edge-caption"><rect x="663" y="490" width="54" height="22" rx="5"/><text class="edge-label" x="690" y="505" text-anchor="middle">修改 S</text></g><path class="edge" data-from="system" data-to="results" d="M780 610L880 610" marker-end="url(#architecture-arrow-f)"/><g class="edge-caption"><rect x="810" y="575" width="40" height="22" rx="5"/><text class="edge-label" x="830" y="590" text-anchor="middle">测量</text></g><path class="edge" data-from="results" data-to="continuation" d="M1010 555L1010 450" marker-end="url(#architecture-arrow-f)"/><g class="edge-caption"><rect x="1057" y="490" width="66" height="22" rx="5"/><text class="edge-label" x="1090" y="505" text-anchor="middle">后续收益</text></g><path class="edge" data-from="continuation" data-to="improver" d="M880 395L780 395" marker-end="url(#architecture-arrow-f)"/><g class="edge-caption"><rect x="810" y="350" width="40" height="22" rx="5"/><text class="edge-label" x="830" y="365" text-anchor="middle">对照</text></g><path class="edge" data-from="continuation" data-to="meta" d="M1010 340L1010 275L820 275L820 190L780 190" marker-end="url(#architecture-arrow-f)"/><g class="edge-caption"><rect x="957" y="242" width="66" height="22" rx="5"/><text class="edge-label" x="990" y="257" text-anchor="middle">改进效率</text></g><path class="edge" data-from="meta" data-to="candidate" d="M440 190L350 190L350 285L170 285L170 340" marker-end="url(#architecture-arrow-f)"/><g class="edge-caption"><rect x="218.5" y="252" width="53" height="22" rx="5"/><text class="edge-label" x="245" y="267" text-anchor="middle">元提案</text></g><path class="edge advice" data-from="candidate" data-to="handoff" d="M170 450L170 555" marker-end="url(#architecture-arrow-f)"/><g class="edge-caption"><rect x="214.5" y="490" width="61" height="22" rx="5"/><text class="edge-label" x="245" y="505" text-anchor="middle">审计 I&apos;</text></g><path class="edge" data-from="handoff" data-to="improver" d="M300 610L370 610L370 395L440 395" marker-end="url(#architecture-arrow-f)"/><g class="edge-caption"><rect x="319" y="475" width="92" height="22" rx="5"/><text class="edge-label" x="365" y="490" text-anchor="middle">后继真正接管</text></g><path class="edge" data-from="system" data-to="lineage" d="M610 665L610 705" marker-end="url(#architecture-arrow-f)"/><g class="edge-caption"><rect x="685" y="680" width="40" height="22" rx="5"/><text class="edge-label" x="705" y="695" text-anchor="middle">版本</text></g><path class="edge" data-from="handoff" data-to="lineage" d="M170 665L170 737L440 737.5" marker-end="url(#architecture-arrow-f)"/><g class="edge-caption"><rect x="275" y="705" width="70" height="22" rx="5"/><text class="edge-label" x="310" y="720" text-anchor="middle">(S&apos;, I&apos;)</text></g>
<g class="architecture-node" data-node="0" data-component="objective"><rect class="node input" x="40" y="140" width="260" height="100" rx="15"/><text class="node-label" x="170" y="173" text-anchor="middle">研究目标 / 可写边界</text><text class="node-detail" x="170" y="200" text-anchor="middle">系统与改进器分别定义</text><text class="node-detail" x="170" y="222" text-anchor="middle">提出可反驳的改进目标</text></g><g class="architecture-node" data-node="1" data-component="meta"><rect class="node updater" x="440" y="140" width="340" height="100" rx="15"/><text class="node-label" x="610" y="173" text-anchor="middle">外层元控制 / 预算</text><text class="node-detail" x="610" y="200" text-anchor="middle">决定实验、算子与调度</text><text class="node-detail" x="610" y="222" text-anchor="middle">最外层经常仍是固定的</text></g><g class="architecture-node" data-node="2" data-component="improver"><rect class="node state" x="440" y="340" width="340" height="110" rx="15"/><text class="node-label" x="610" y="373" text-anchor="middle">改进器 I_t</text><text class="node-detail" x="610" y="400" text-anchor="middle">提案、搜索与选择策略</text><text class="node-detail" x="610" y="422" text-anchor="middle">自动研发不必然改变 I</text></g><g class="architecture-node" data-node="3" data-component="system"><rect class="node execution" x="440" y="555" width="340" height="110" rx="15"/><text class="node-label" x="610" y="588" text-anchor="middle">目标系统 S_t</text><text class="node-detail" x="610" y="615" text-anchor="middle">模型、程序与可变资产</text><text class="node-detail" x="610" y="637" text-anchor="middle">任务收益与元收益分开</text></g><g class="architecture-node" data-node="4" data-component="results"><rect class="node feedback" x="880" y="555" width="260" height="110" rx="15"/><text class="node-label" x="1010" y="588" text-anchor="middle">任务表现 / 完整成本</text><text class="node-detail" x="1010" y="615" text-anchor="middle">含失败、低分和搜索成本</text><text class="node-detail" x="1010" y="637" text-anchor="middle">不是只报最终赢家</text></g><g class="architecture-node" data-node="5" data-component="continuation"><path class="node gate" d="M904 340H1116L1140 395L1116 450H904L880 395Z"/><text class="node-label" x="1010" y="373" text-anchor="middle">同起点继续实验</text><text class="node-detail" x="1010" y="400" text-anchor="middle">旧 I 与新 I 同预算续跑</text><text class="node-detail" x="1010" y="422" text-anchor="middle">比较后继改进效率</text></g><g class="architecture-node" data-node="6" data-component="candidate"><rect class="node candidate" x="40" y="340" width="260" height="110" rx="15"/><text class="node-label" x="170" y="373" text-anchor="middle">候选改进器 I&apos;</text><text class="node-detail" x="170" y="400" text-anchor="middle">修改产生改进的机制</text><text class="node-detail" x="170" y="422" text-anchor="middle">不只再生成目标程序</text></g><g class="architecture-node" data-node="7" data-component="handoff"><rect class="node reuse" x="40" y="555" width="260" height="110" rx="15"/><text class="node-label" x="170" y="588" text-anchor="middle">安装 / 接管证据</text><text class="node-detail" x="170" y="615" text-anchor="middle">新 I 实际进入下一轮</text><text class="node-detail" x="170" y="637" text-anchor="middle">保存文件不等于完成交接</text></g><g class="architecture-node" data-node="8" data-component="lineage"><rect class="node state" x="440" y="705" width="340" height="65" rx="15"/><path class="stack-mark" d="M454 719H478M454 725H478M454 731H478"/><text class="node-label" x="610" y="732" text-anchor="middle">双层版本谱系 (S, I)</text><text class="node-detail" x="610" y="759" text-anchor="middle">目标产物与改进器分开留证</text></g>
<rect x="30" y="790" width="1140" height="86" rx="14" fill="var(--panel,#102238)" stroke="var(--line,#43647f)"/>
<text x="52" y="817" fill="var(--text,#edf5ff)" font-family="system-ui,sans-serif" font-size="14">持久对象：目标系统 S、改进器 I、实验策略、调度、算子、证据与谱系</text>
<text x="52" y="844" fill="var(--muted,#b8cadb)" font-family="system-ui,sans-serif" font-size="13">最外层控制、评价或基础模型常仍固定；理论可证明自修改与经验搜索不是同一种保证。</text>
<text x="600" y="895" text-anchor="middle" fill="var(--muted,#b8cadb)" font-family="system-ui,sans-serif" font-size="12">原创家族架构，不是某篇论文原图；虚线表示可选更新或建议审计，不保证所有方法实现。</text>
</svg>
