<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RSI 家族架构与代表流程</title>
<style>
:root{color-scheme:dark;--bg:#0b1727;--panel:#102238;--node:#152b43;--line:#43647f;--text:#edf5ff;--muted:#b8cadb;--accent:#69d8c8;--gold:#ffd08a;--focus:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,-apple-system,sans-serif}body.light{color-scheme:light;--bg:#f4f7fb;--panel:#fff;--node:#e8f0f8;--line:#9cb0c4;--text:#192c42;--muted:#435f79;--accent:#08786f;--gold:#91610c;--focus:#174c89}.shell{width:min(1280px,calc(100% - 32px));margin:auto}header{padding:20px 0 8px}h1{font-size:clamp(23px,3vw,34px);line-height:1.3;margin:10px 0}p{color:var(--muted);margin:10px 0}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:15px 0}button,select{font:inherit;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px 13px;cursor:pointer}button.active{border-color:var(--accent);color:var(--accent)}a{color:var(--accent);overflow-wrap:anywhere}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}.view[hidden]{display:none}.diagram svg{width:100%;height:auto;display:block}.detail{padding:14px 18px;border-left:4px solid var(--accent);background:var(--bg);border-radius:0 10px 10px 0;margin-top:12px}.detail h2{font-size:20px;margin:0 0 8px}.detail p{margin:0}.notes{display:grid;grid-template-columns:1fr 1fr;gap:14px}.notes h2{font-size:19px;margin:0}.notes p{font-size:14px}.source-list{display:flex;gap:15px;flex-wrap:wrap;font-size:14px}.architecture-node{cursor:pointer}.mobile-nodes{display:none}.mobile-nodes button{text-align:left}.flow-step{padding:12px 15px;border:1px solid var(--line);border-radius:10px}.flow-step.current{border-color:var(--accent)}.flow-step p{font-size:14px}.all-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}.small{font-size:13px;color:var(--muted)}footer{padding:10px 0 28px}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.flow-frame [data-step]{cursor:pointer}.flow-frame [data-step].selected rect{stroke:#69d8c8;stroke-width:3.5}
@media(max-width:650px){.shell{width:calc(100% - 20px)}.notes,.all-steps{grid-template-columns:1fr}.diagram{display:block}.mobile-nodes{display:grid;gap:9px;margin-top:12px}.panel{padding:14px}.source-list{gap:10px}}
@media(prefers-reduced-motion:no-preference){.playing [data-step].selected rect{animation:pulse 1.5s infinite}@keyframes pulse{50%{stroke-width:6}}}
</style></head>
<body><div class="shell">
<header><div class="small">RSI ATLAS · 家族级原创架构 / 代表流程 / 论文原图分层</div><h1 id="title"></h1><p id="idea"></p></header>
<nav class="toolbar" aria-label="图示类型"><button id="architecture-tab">整体思想架构</button><button id="flow-tab">代表流程</button><button id="theme">切换明暗</button><a id="svg-link">下载当前 SVG</a></nav>
<main>
<section id="architecture" class="view panel"><p class="small">组件与持久状态关系，不是某篇论文原图。点击组件查看说明；虚线表示应检查的准入边界，不声称各论文均已实现。</p><div class="diagram" id="architecture-frame">__ARCHITECTURE_SVG__</div><div class="mobile-nodes" id="mobile-nodes"></div><div class="detail" id="node-detail" aria-live="polite"></div></section>
<section id="flow" class="view panel" hidden><h2 id="flow-title"></h2><p id="flow-note"></p><div class="controls"><button id="play" aria-pressed="false">播放</button><button id="next">下一步</button><button id="reset">复位</button><select id="speed" aria-label="播放速度"><option value="2400">慢速</option><option value="1400" selected>标准</option><option value="650">快速</option></select><span id="position"></span></div><div class="diagram flow-frame" id="flow-frame">__FLOW_SVG__</div><div class="detail" id="flow-detail" aria-live="polite"></div><div class="all-steps" id="all-steps"></div></section>
<section class="notes"><div class="panel"><h2>持久对象与外部边界</h2><p id="persistent"></p><p id="boundary"></p></div><div class="panel"><h2>不要混淆的子路线</h2><p id="distinction"></p><p id="evidence"></p></div></section>
</main><footer><div class="source-list" id="sources"></div><p class="small">本页可离线打开，无外部脚本、无遥测。原论文仅在主动点击来源时访问。动态图是机制说明，不是实验运行记录。</p></footer>
</div><script type="application/json" id="family-data">__FAMILY_DATA__</script>
<script>
'use strict';const data=JSON.parse(document.getElementById('family-data').textContent);const {family,scene}=data;const $=id=>document.getElementById(id);const escape=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let step=0,timer=null;
document.title=family.code+' 家族 · '+family.title+'整体思想架构';$('title').textContent=family.code+' 家族 · '+family.title;$('idea').textContent=family.idea;$('persistent').textContent=family.persistent;$('boundary').textContent=family.boundary;$('distinction').textContent=family.distinction;$('evidence').textContent=family.evidence;$('flow-title').textContent=scene.title;$('flow-note').textContent=scene.note;$('sources').innerHTML=family.sources.map(source=>'<a href="'+escape(source.url)+'" target="_blank" rel="noopener">'+escape(source.name)+'</a>').join('');
document.querySelectorAll('.diagram svg').forEach(svg=>svg.setAttribute('role','group'));
function selectNode(index){const node=family.nodes[index];document.querySelectorAll('[data-node]').forEach(element=>{element.classList.toggle('selected',Number(element.dataset.node)===index);element.setAttribute('aria-pressed',String(Number(element.dataset.node)===index));});$('node-detail').innerHTML='<h2>'+escape(node.label)+'</h2><p>'+escape(node.detail.join('；'))+'</p>';}
$('mobile-nodes').innerHTML=family.nodes.map((node,index)=>'<button data-node="'+index+'">'+escape(node.label)+'<br><span class="small">'+escape(node.detail.join('；'))+'</span></button>').join('');
document.querySelectorAll('[data-node]').forEach(node=>{node.setAttribute('role','button');node.setAttribute('tabindex','0');node.setAttribute('aria-label',family.nodes[Number(node.dataset.node)].label);node.addEventListener('click',()=>selectNode(Number(node.dataset.node)));node.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();selectNode(Number(node.dataset.node));}});});
function stop(){if(timer!==null)clearInterval(timer);timer=null;$('play').textContent='播放';$('play').setAttribute('aria-pressed','false');$('flow-frame').classList.remove('playing');}
function showView(kind){stop();$('architecture').hidden=kind!=='architecture';$('flow').hidden=kind!=='flow';$('architecture-tab').classList.toggle('active',kind==='architecture');$('flow-tab').classList.toggle('active',kind==='flow');$('svg-link').href='family-'+family.id+'-'+kind+'.svg';}
function showStep(){const current=scene.steps[step];$('position').textContent=(step+1)+' / '+scene.steps.length;$('flow-detail').innerHTML='<h2>'+escape(current.label)+'</h2><p>'+escape(current.detail)+'</p>';$('flow-frame').querySelectorAll('[data-step]').forEach(node=>node.classList.toggle('selected',Number(node.dataset.step)===step));$('all-steps').innerHTML=scene.steps.map((item,index)=>'<div class="flow-step '+(index===step?'current':'')+'"><strong>'+escape((index+1)+'. '+item.label)+'</strong><p>'+escape(item.detail)+'</p></div>').join('');$('next').disabled=step===scene.steps.length-1;}
$('flow-frame').querySelectorAll('[data-step]').forEach(node=>{node.setAttribute('role','button');node.setAttribute('tabindex','0');node.setAttribute('aria-label',scene.steps[Number(node.dataset.step)].label);const choose=()=>{stop();step=Number(node.dataset.step);showStep();};node.addEventListener('click',choose);node.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();choose();}});});
$('architecture-tab').onclick=()=>showView('architecture');$('flow-tab').onclick=()=>showView('flow');$('theme').onclick=()=>document.body.classList.toggle('light');$('next').onclick=()=>{stop();step=Math.min(step+1,scene.steps.length-1);showStep();};$('reset').onclick=()=>{stop();step=0;showStep();};$('play').onclick=()=>{if(timer!==null){stop();return;}if(step===scene.steps.length-1)step=0;showStep();$('play').textContent='暂停';$('play').setAttribute('aria-pressed','true');$('flow-frame').classList.add('playing');timer=setInterval(()=>{step++;showStep();if(step===scene.steps.length-1)stop();},Number($('speed').value));};$('speed').onchange=stop;document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});selectNode(1);showStep();showView(data.default_view);window.familyReady=true;
</script></body></html>
